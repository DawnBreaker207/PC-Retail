name: pc-retail

networks:
  network:
    driver: bridge

volumes:
  postgres:
  kafka:
  loki:
  grafana:
  prometheus:

# Env dùng chung cho các service nghiệp vụ (auth/order/inventory/payment/catalog)
x-service-env: &service-env
  DB_URL: ${DB_URL}
  DB_USER: ${DB_USER}
  DB_PASS: ${DB_PASS}
  DB_DRIVER: ${DB_DRIVER}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_LOG_TOPIC: app-logs
  OUTBOX_RELAY_ENABLED: 'true'
  # Custom Redis (infra/redis-custom) chỉ dùng cho cache SKU; cache lỗi thì fallback DB
  CUSTOM_REDIS_ENABLED: 'true'
  CUSTOM_REDIS_HOST: redis-custom
  CUSTOM_REDIS_PORT: 8888
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
  JWT_COOKIE_NAME: ${JWT_COOKIE_NAME}
  JWT_REFRESH_COOKIE_NAME: ${JWT_REFRESH_COOKIE_NAME}
  # RS256: service chỉ có public key; private key chỉ đặt ở auth-service
  JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
  JWT_KEY_ID: ${JWT_KEY_ID:-pc-retail}
  JWT_ISSUER: ${JWT_ISSUER:-pc-retail}
  JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
  JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS}
  FRONTEND_URL: ${FRONTEND_URL}

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=512MB"]
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - '5432:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d demo']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - network

  redis:
    container_name: redis
    image: redis:7-alpine
    ports:
      - '6379:6379'
    networks:
      - network
    command: ['redis-server', '--notify-keyspace-events', 'Ex']

  # Redis tự build (RESP, SET/GET/PX) — cache SKU, chạy song song redis chính.
  redis-custom:
    build:
      context: ./redis-custom
    container_name: redis-custom
    ports:
      - '6380:8888'
    networks:
      - network

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4-management-alpine
    ports:
      - '5672:5672'
      - '15672:15672'
    networks:
      - network
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'check_port_connectivity']
      interval: 15s
      timeout: 5s
      retries: 5

  kafka:
    container_name: kafka
    image: apache/kafka:4.4.0
    ports:
      # host clients (IDE): localhost:29092 — in-network clients: kafka:9092
      - '29092:29092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # topic tự tạo: order-events, payment-events, inventory-events, pc-clickstream, app-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka:/var/lib/kafka/data
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - network

  kafka-init:
    container_name: kafka-init
    image: apache/kafka:4.4.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        for topic in order-events payment-events inventory-events pc-clickstream app-logs; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
        done
    restart: 'no'
    networks:
      - network

  loki:
    container_name: loki
    image: grafana/loki:3.7.9
    ports:
      - '3100:3100'
    command: ['-config.file=/etc/loki/local-config.yaml']
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki:/loki
    networks:
      - network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus:/prometheus
    ports:
      - '9090:9090'
    networks:
      - network

  grafana:
    container_name: grafana
    image: grafana/grafana:13.2.5
    ports:
      - '3000:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
      - prometheus
    networks:
      - network

  vector:
    container_name: vector
    image: timberio/vector:0.60.0-alpine
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - ./vector/vector.toml:/etc/vector/vector.toml:ro
    depends_on:
      kafka:
        condition: service_healthy
      loki:
        condition: service_started
    networks:
      - network

  backend:
    # Monolith cũ: chỉ chạy khi bật profile "monolith". Mặc định dùng gateway + services.
    profiles: ['monolith']
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - '8888:8888'
    environment:
      # Server
      SERVER_PORT: ${SERVER_PORT}
      # Database
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_DRIVER: ${DB_DRIVER}
      # Redis
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      # Custom Redis (cache SKU)
      CUSTOM_REDIS_ENABLED: 'true'
      CUSTOM_REDIS_HOST: redis-custom
      CUSTOM_REDIS_PORT: 8888
      # RabbitMQ
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      # Kafka (log appender)
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_LOG_TOPIC: app-logs
      SERVICE_NAME: dawn-app
      # JWT (monolith vẫn có endpoint đăng nhập nên cần private key)
      JWT_COOKIE_NAME: ${JWT_COOKIE_NAME}
      JWT_REFRESH_COOKIE_NAME: ${JWT_REFRESH_COOKIE_NAME}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_KEY_ID: ${JWT_KEY_ID:-pc-retail}
      JWT_ISSUER: ${JWT_ISSUER:-pc-retail}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS}
      # VNPay
      VNPAY_URL: ${VNPAY_URL}
      VNPAY_QUERY_URL: ${VNPAY_QUERY_URL}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE}
      VNPAY_SECRET_KEY: ${VNPAY_SECRET_KEY}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL}
      VNPAY_VERSION: ${VNPAY_VERSION}
      VNPAY_COMMAND: ${VNPAY_COMMAND}
      VNPAY_ORDER_TYPE: ${VNPAY_ORDER_TYPE}
      # AI
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL}
      # Mail
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_FROM: ${MAIL_FROM}
      FRONTEND_URL: ${FRONTEND_URL}
      # Risk-gate OTP debug: trả mã về response cho E2E/demo. PROD đặt false.
      APP_OTP_DEBUG: ${APP_OTP_DEBUG:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      redis-custom:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "</dev/tcp/127.0.0.1/8888"']
      interval: 15s
      timeout: 5s
      retries: 12
    networks:
      - network

  order-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        MODULE: svc-order
    container_name: order-service
    environment:
      <<: *service-env
      SERVER_PORT: 8081
      SERVICE_NAME: order-service
      CATALOG_SERVICE_URL: http://catalog-service:8084
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      USER_SERVICE_URL: http://auth-service:8085
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - network

  inventory-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        MODULE: svc-inventory
    container_name: inventory-service
    environment:
      <<: *service-env
      SERVER_PORT: 8082
      SERVICE_NAME: inventory-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - network

  payment-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        MODULE: svc-payment
    container_name: payment-service
    environment:
      <<: *service-env
      SERVER_PORT: 8083
      SERVICE_NAME: payment-service
      ORDER_SERVICE_URL: http://order-service:8081
      VNPAY_URL: ${VNPAY_URL}
      VNPAY_QUERY_URL: ${VNPAY_QUERY_URL}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE}
      VNPAY_SECRET_KEY: ${VNPAY_SECRET_KEY}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL}
      VNPAY_VERSION: ${VNPAY_VERSION}
      VNPAY_COMMAND: ${VNPAY_COMMAND}
      VNPAY_ORDER_TYPE: ${VNPAY_ORDER_TYPE}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - network

  catalog-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        MODULE: svc-catalog
    container_name: catalog-service
    environment:
      <<: *service-env
      SERVER_PORT: 8084
      SERVICE_NAME: catalog-service
      ORDER_SERVICE_URL: http://order-service:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      redis-custom:
        condition: service_started
    networks:
      - network

  auth-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        MODULE: svc-auth
    container_name: auth-service
    environment:
      <<: *service-env
      SERVER_PORT: 8085
      SERVICE_NAME: auth-service
      # Identity provider là nơi duy nhất giữ private key
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      APP_OTP_DEBUG: ${APP_OTP_DEBUG:-false}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_FROM: ${MAIL_FROM}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - network

  gateway:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        MODULE: svc-gateway
    container_name: gateway
    ports:
      - '8080:8080'
    environment:
      SERVER_PORT: 8080
      SERVICE_NAME: gateway
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ISSUER: ${JWT_ISSUER:-pc-retail}
      AUTH_SERVICE_URL: http://auth-service:8085
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      CATALOG_SERVICE_URL: http://catalog-service:8084
    depends_on:
      - auth-service
      - order-service
      - inventory-service
      - payment-service
      - catalog-service
    networks:
      - network

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    image: pc-retail-frontend
    container_name: frontend
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      BACKEND_URL: http://gateway:8080
      NG_TRUST_PROXY_HEADERS: x-forwarded-for,x-forwarded-proto
    depends_on:
      gateway:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:4000/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - network

  nginx:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: nginx
    ports:
      - '4200:80'
    depends_on:
      gateway:
        condition: service_started
      frontend:
        condition: service_healthy
    networks:
      - network
