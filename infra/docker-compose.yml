services:
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - '5432:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d demo']
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres:
