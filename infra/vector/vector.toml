# Kafka app-logs -> Loki. Logback sends one JSON object per record.
[sources.app_logs]
type = "kafka"
bootstrap_servers = "kafka:9092"
group_id = "vector-app-logs"
topics = ["app-logs"]
decoding.codec = "json"

[sinks.loki]
type = "loki"
inputs = ["app_logs"]
endpoint = "http://loki:3100"
encoding.codec = "json"
labels.service = "{{ service }}"
labels.level = "{{ level }}"
