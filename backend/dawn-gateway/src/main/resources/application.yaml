server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: dawn-gateway
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: dawn-user-otp
              uri: ${USER_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/auth/otp/**
              filters:
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@strictRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
            - id: dawn-auth
              uri: ${AUTH_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@strictRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
            - id: dawn-user
              uri: ${USER_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/users/**
              filters:
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@strictRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
            - id: dawn-ai
              uri: ${AI_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/ai/**,/api/v1/recommendations/**
              filters:
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@standardRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
            - id: dawn-inventory-stocktake
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/admin/stock-takes/**
              filters:
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@standardRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
            - id: dawn-order
              uri: ${ORDER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/orders/**,/api/v1/cart/**,/api/v1/promotion/**,/api/v1/articles/**,/api/v1/articles,/api/v1/vouchers/**,/api/v1/staff/**,/api/v1/sub-orders/**,/api/v1/return-requests/**,/api/v1/reviews/**,/api/v1/shipping/**,/api/v1/admin/**
              filters:
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@strictRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
            - id: dawn-inventory
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/inventory/**
              filters:
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@standardRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
            - id: dawn-payment
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/payments/**,/api/v1/tax/**
              filters:
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@strictRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
            - id: dawn-notification
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8090}
              predicates:
                - Path=/api/v1/notifications/**
              filters:
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@standardRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
            - id: dawn-media
              uri: ${MEDIA_SERVICE_URL:http://localhost:8091}
              predicates:
                - Path=/api/v1/media/**
              filters:
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@standardRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
            - id: dawn-rating
              uri: ${CATALOG_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/ratings/**
              filters:
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@standardRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
            - id: dawn-wishlist
              uri: ${USER_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/wishlist/**
              filters:
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@strictRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
            - id: dawn-catalog
              uri: ${CATALOG_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/**
              filters:
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@standardRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"

app:
  jwt:
    issuer: ${JWT_ISSUER:pc-retail}
    jwks-uri: ${AUTH_SERVICE_URL:http://localhost:8085}/api/v1/auth/jwks

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://zipkin:9411/api/v2/spans}
