server:
  port: ${SERVER_PORT}
# Config Springdoc
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
spring:
  # Import ENV
  config:
    import: 'optional:file:.env[.properties]'
  application:
    name: backend
  # Virtual Thread
  threads:
    virtual:
      enabled: true
  # Config Database
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: ${DB_DRIVER}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  # Config JPA
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  sql:
    init:
      mode: never
      schema-locations: classpath:db/migration
      data-locations: classpath:db/migration
  # Config Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
    baseline-on-migrate: true
  # Config Redis
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  # Config RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASS}
  # Config Mail
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USER}
    password: ${MAIL_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  # Config Thymeleaf
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
app:
  mail:
    from: ${MAIL_FROM}
  frontend:
    url: ${FRONTEND_URL}
  opt:
    ttlMinutes: 5
    cooldownSeconds: 60
  passwordResetExpirationMinutes: 15
  # Config JWT
  jwtCookieName: ${JWT_COOKIE_NAME}
  jwtRefreshCookieName: ${JWT_REFRESH_COOKIE_NAME}
  jwtSecret: ${JWT_SECRET}
  jwtExpirationsMs: ${JWT_EXPIRATION_MS}
  jwtRefreshExpirationsMs: ${JWT_REFRESH_EXPIRATION_MS}
ai:
  base-url: ${AI_BASE_URL}
  api-key: ${AI_API_KEY}
  chat-model: ${AI_CHAT_MODEL}
  embedding-model: ${AI_EMBEDDING_MODEL}

langchain4j:
  chat-model:
    enabled: false
  embedding-model:
    enabled: false
  #Config Payment
payment:
  # VNPay
  VNPay:
    url: ${VNPAY_URL}
    queryUrl: ${VNPAY_QUERY_URL}
    tmnCode: ${VNPAY_TMN_CODE}
    secretKey: ${VNPAY_SECRET_KEY}
    returnUrl: ${VNPAY_RETURN_URL}
    version: ${VNPAY_VERSION}
    command: ${VNPAY_COMMAND}
    orderType: ${VNPAY_ORDER_TYPE}
