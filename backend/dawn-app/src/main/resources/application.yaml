server:
  port: 8888
# Config Springdoc
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
spring:
  # Import ENV
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: backend
  # Virtual Thread
  threads:
    virtual:
      enabled: true
  # Config Database
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: ${DB_DRIVER}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  # Config JPA
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  sql:
    init:
      mode: never
      schema-locations: classpath:db/migration
      data-locations: classpath:db/migration
  # Config Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
    baseline-on-migrate: true
  # Config Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  # Config RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
  # Config Mail
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  # Config Thymeleaf
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
app:
  mail:
    from: noreply@prretail.vn
  frontend:
    url: http://localhost:4200
  opt:
    ttlMinutes: 5
    cooldownSeconds: 60
  passwordResetExpirationMinutes: 15
  # Config JWT
  jwtCookieName: accessToken
  jwtRefreshCookieName: refreshToken
  jwtSecret: ${JWT_SECRET:dGhpc2lzYXZlcnlzZWNyZXRrZXlmb3JkZXZlbG9wbWVudDI1Ng==}
  jwtExpirationsMs: ${JWT_EXPIRATION_MS:900000}
  jwtRefreshExpirationsMs: ${JWT_REFRESH_EXPIRATION_MS:604800000}
openrouter:
  base-url: https://openrouter.ai/api/v1
  api-key: ${OPEN_ROUTER_API}
  chat-model: openai/gpt-4o-mini
  embedding-model: openai/text-embedding-ada-002

langchain4j:
  chat-model:
    enabled: false
  embedding-model:
    enabled: false
  #Config Payment
payment:
  # VNPay
  VNPay:
    url: ${VNPAY_URL}
    queryUrl: ${VNPAY_QUERY_URL}
    tmnCode: ${VNPAY_TMN_CODE}
    secretKey: ${VNPAY_SECRET_KEY}
    returnUrl: ${VNPAY_RETURN_URL}
    version: ${VNPAY_VERSION}
    command: ${VNPAY_COMMAND}
    orderType: ${VNPAY_ORDER_TYPE}
