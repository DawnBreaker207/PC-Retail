<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Xác thực tài khoản</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:'Segoe UI',Arial,sans-serif">
<table width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center" style="padding:40px 16px">
            <table width="480" cellpadding="0" cellspacing="0"
                   style="background:#ffffff;border-radius:8px;overflow:hidden">

                <!-- Header -->
                <div th:replace="~{fragments/header :: header}"></div>

                <!-- Body -->
                <tr>
                    <td style="padding:32px">
                        <p style="margin:0 0 8px;font-size:22px;font-weight:600;color:#1a1a1a">
                            Xác thực tài khoản
                        </p>
                        <p style="margin:0 0 24px;color:#555;font-size:15px;line-height:1.6">
                            Xin chào <strong th:text="${fullName}">Bạn</strong>,<br/>
                            Đây là mã xác thực để hoàn tất đăng ký tài khoản:
                        </p>

                        <!-- OTP box -->
                        <div style="background:#f5f5f5;border-radius:8px;padding:20px;
                          text-align:center;margin:0 0 24px">
                <span th:text="${otp}"
                      style="font-size:40px;font-weight:700;letter-spacing:12px;
                             color:#1a1a1a;font-family:monospace">
                  000000
                </span>
                        </div>

                        <p style="margin:0 0 8px;color:#888;font-size:13px">
                            Mã có hiệu lực trong
                            <strong th:text="${ttlMinutes}">5</strong> phút.
                        </p>
                        <p style="margin:0;color:#888;font-size:13px">
                            Nếu bạn không đăng ký tài khoản, hãy bỏ qua email này.
                        </p>
                    </td>
                </tr>

                <!-- Footer -->
                <div th:replace="~{fragments/footer :: footer}"></div>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
