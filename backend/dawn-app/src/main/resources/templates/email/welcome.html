<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Chào mừng</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:'Segoe UI',Arial,sans-serif">
<table width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center" style="padding:40px 16px">
            <table width="480" cellpadding="0" cellspacing="0"
                   style="background:#ffffff;border-radius:8px;overflow:hidden">

                <!-- Header -->
                <tr>
                    <td style="background:#0f0f0f;padding:24px 32px">
                        <span style="color:#e53935;font-size:20px;font-weight:700">PC Retail</span>
                    </td>
                </tr>

                <!-- Body -->
                <tr>
                    <td style="padding:32px">
                        <p style="margin:0 0 8px;font-size:22px;font-weight:600;color:#1a1a1a">
                            Chào mừng bạn! 🎉
                        </p>
                        <p style="margin:0 0 24px;color:#555;font-size:15px;line-height:1.6">
                            Xin chào <strong th:text="${fullName}">Bạn</strong>,<br/>
                            Tài khoản của bạn đã được xác thực thành công.
                            Chào mừng bạn đến với PC Retail!
                        </p>
                        <p style="margin:0;color:#888;font-size:13px;line-height:1.6">
                            Bạn có thể bắt đầu mua sắm, theo dõi đơn hàng và nhiều tính năng khác
                            ngay bây giờ.
                        </p>
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="padding:16px 32px;border-top:1px solid #eeeeee">
                        <p style="margin:0;color:#aaa;font-size:12px">
                            © 2025 PC Retail. Email này được gửi tự động, vui lòng không trả lời.
                        </p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
