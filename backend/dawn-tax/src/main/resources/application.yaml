server:
  port: ${SERVER_PORT:8094}
  shutdown: graceful

logging:
  config: classpath:logback-service.xml

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    import: 'optional:file:.env[.properties]'
  application:
    name: dawn-tax
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 10000
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: ${DB_DRIVER}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: basic
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  internal:
    token: ${INTERNAL_TOKEN:}
  jwt:
    issuer: ${JWT_ISSUER:pc-retail}
    key-id: ${JWT_KEY_ID:pc-retail}
    public-key: ${JWT_PUBLIC_KEY}
  jwtCookieName: ${JWT_COOKIE_NAME}
  jwtRefreshCookieName: ${JWT_REFRESH_COOKIE_NAME}
  jwtExpirationsMs: ${JWT_EXPIRATION_MS}
  jwtRefreshExpirationsMs: ${JWT_REFRESH_EXPIRATION_MS}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://zipkin:9411/api/v2/spans}
