server:
  port: ${SERVER_PORT:8087}
  shutdown: graceful

spring:
  application:
    name: dawn-ai
  flyway:
    enabled: true
    locations: classpath:db/migration/ai
    table: flyway_schema_history_ai
    validate-on-migrate: false
    baseline-on-migrate: true
    baseline-version: '0'

app:
  jwt:
    issuer: ${JWT_ISSUER:pc-retail}
    key-id: ${JWT_KEY_ID:pc-retail}
    public-key: ${JWT_PUBLIC_KEY:}

dawn:
  ai:
    vector-dimensions: 13
    bm25:
      k: 1.5
      b: 0.75
    trending-decay-hours: 24
