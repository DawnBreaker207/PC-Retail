server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

logging:
  config: classpath:logback-service.xml

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    import: 'optional:file:.env[.properties]'
  application:
    name: dawn-catalog
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 20000
      idle-timeout: 300000
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: ${DB_DRIVER}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: basic
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

app:
  opensearch:
    enabled: ${OPENSEARCH_ENABLED:false}
    host: ${OPENSEARCH_HOST:localhost}
    port: ${OPENSEARCH_PORT:9200}
  frontend:
    url: ${FRONTEND_URL:http://localhost:4200}
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}
  cache:
    custom-redis:
      enabled: ${CUSTOM_REDIS_ENABLED:false}
      host: ${CUSTOM_REDIS_HOST:localhost}
      port: ${CUSTOM_REDIS_PORT:6380}
  internal:
    token: ${INTERNAL_TOKEN:}
  services:
    mode: distributed
    order-url: ${ORDER_SERVICE_URL:http://localhost:8081}
  opt:
    ttlMinutes: 5
    cooldownSeconds: 60
  passwordResetExpirationMinutes: 15
  jwtCookieName: ${JWT_COOKIE_NAME}
  jwtRefreshCookieName: ${JWT_REFRESH_COOKIE_NAME}
  jwtExpirationsMs: ${JWT_EXPIRATION_MS}
  jwtRefreshExpirationsMs: ${JWT_REFRESH_EXPIRATION_MS}
  jwt:
    issuer: ${JWT_ISSUER:pc-retail}
    key-id: ${JWT_KEY_ID:pc-retail}
    public-key: ${JWT_PUBLIC_KEY}
resilience4j:
  circuitbreaker:
    instances:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
  timelimiter:
    instances:
      default:
        timeout-duration: 10s
  bulkhead:
    instances:
      default:
        max-concurrent-calls: 20
        max-wait-duration: 100ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://zipkin:9411/api/v2/spans}
