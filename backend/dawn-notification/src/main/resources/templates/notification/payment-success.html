<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:remove="all">notification/payment-success</title>
  <th:block th:replace="~{notification/fragments/style :: mailCss}"/>
</head>
<body>
  <div class="preheader">Thanh toán thành công – đơn hàng đang được xử lý.</div>
  <div class="wrap">
    <th:block th:replace="~{notification/fragments/header :: brand(headerBg=${'#1a237e'})}"/>
    <div class="inner">
      <div class="badge" style="background:#e8f5e9;color:#2e7d32;">✓ Thanh toán thành công</div>
      <p class="info">Đơn hàng #<strong th:text="${orderId}">0</strong> đã được xác nhận.</p>
      <div class="infobox">
        Chúng tôi đã nhận được thanh toán của bạn.<br/>
        Đơn hàng sẽ được chuẩn bị và giao trong thời gian sớm nhất.
      </div>
      <div class="cta">
        <a href="#" class="btn">Xem trạng thái đơn hàng</a>
      </div>
    </div>
    <th:block th:replace="~{notification/fragments/footer :: footer}"/>
  </div>
</body>
</html>
