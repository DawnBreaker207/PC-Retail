<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:remove="all">notification/order-shipped</title>
  <th:block th:replace="~{notification/fragments/style :: mailCss}"/>
</head>
<body>
  <div class="preheader">Đơn hàng đang trên đường giao – theo dõi với mã vận đơn.</div>
  <div class="wrap">
    <th:block th:replace="~{notification/fragments/header :: brand(headerBg=${'#0277bd'})}"/>
    <div class="inner">
      <div class="badge" style="background:#e1f5fe;color:#0277bd;">🚚 Đơn hàng đang trên đường giao</div>
      <p class="info">Đơn hàng #<strong th:text="${orderId}">0</strong> đã được bàn giao cho đơn vị vận chuyển.</p>
      <div class="tracking" th:if="${trackingCode}">
        <div class="tracking-label">Mã vận đơn (GHN)</div>
        <div class="tracking-code" th:text="${trackingCode}">GHN000000</div>
      </div>
      <p class="info">
        Bạn có thể theo dõi đơn hàng trực tiếp trên ứng dụng GHN hoặc tại trang đơn hàng của chúng tôi.
      </p>
      <div class="cta">
        <a href="#" class="btn">Theo dõi đơn hàng</a>
      </div>
    </div>
    <th:block th:replace="~{notification/fragments/footer :: footer}"/>
  </div>
</body>
</html>
