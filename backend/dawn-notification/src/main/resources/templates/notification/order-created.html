<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:remove="all">notification/order-created</title>
  <th:block th:replace="~{notification/fragments/style :: mailCss}"/>
</head>
<body>
  <div class="preheader">Đặt hàng thành công – PC Retail đã nhận đơn của bạn.</div>
  <div class="wrap">
    <th:block th:replace="~{notification/fragments/header :: brand(headerBg=${'#1a237e'})}"/>
    <div class="inner">
      <div class="badge" style="background:#e8f5e9;color:#2e7d32;">✓ Đặt hàng thành công</div>
      <p class="info" style="margin:0 0 8px;">Mã đơn hàng của bạn</p>
      <div class="order-id">#<span th:text="${orderId}">ORD-00000</span></div>
      <div class="infobox">
        <strong>Chúng tôi đã nhận được đơn hàng của bạn.</strong><br/>
        Vui lòng hoàn tất thanh toán để đơn hàng được xử lý.<br/>
        Liên kết thanh toán sẽ hiển thị trong tài khoản hoặc qua trang đặt hàng.
      </div>
      <div class="cta">
        <a href="#" class="btn">Xem đơn hàng</a>
      </div>
    </div>
    <th:block th:replace="~{notification/fragments/footer :: footer}"/>
  </div>
</body>
</html>
