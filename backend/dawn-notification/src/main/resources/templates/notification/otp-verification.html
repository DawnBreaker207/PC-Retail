<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Mã xác thực OTP</title>
  <style>
    body { margin:0; font-family: 'Segoe UI', Arial, sans-serif; background:#f5f6fa; color:#222; }
    .wrap { max-width:600px; margin:32px auto; background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.08); }
    .header { background:#1a237e; color:#fff; padding:28px 32px; }
    .header h1 { margin:0; font-size:22px; }
    .header p { margin:4px 0 0; font-size:13px; opacity:.8; }
    .body { padding:32px; text-align:center; }
    .otp-box { background:#f0f4ff; border-radius:12px; padding:28px 20px; margin:24px 0; display:inline-block; min-width:200px; }
    .otp-label { font-size:12px; color:#888; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
    .otp-code { font-size:48px; font-weight:700; color:#1a237e; letter-spacing:12px; }
    .info { font-size:14px; color:#666; line-height:1.7; }
    .warning { font-size:12px; color:#e53935; margin-top:16px; }
    .footer { background:#f0f0f0; padding:18px 32px; font-size:12px; color:#888; text-align:center; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>PC Retail</h1>
    <p>Hệ thống bán lẻ linh kiện máy tính</p>
  </div>
  <div class="body">
    <p class="info">Mã xác thực của bạn</p>
    <div class="otp-box">
      <div class="otp-label">OTP</div>
      <div class="otp-code" th:text="${otp}">000000</div>
    </div>
    <p class="info">
      Mã có hiệu lực trong <strong>5 phút</strong>.<br/>
      Vui lòng không chia sẻ mã này với bất kỳ ai.
    </p>
    <p class="warning">Nếu bạn không yêu cầu mã này, hãy bỏ qua email này.</p>
  </div>
  <div class="footer">
    Email này được gửi tự động từ hệ thống PC Retail. Vui lòng không trả lời.
  </div>
</div>
</body>
</html>
