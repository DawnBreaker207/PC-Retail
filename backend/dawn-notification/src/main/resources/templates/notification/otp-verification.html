<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:remove="all">notification/otp-verification</title>
  <th:block th:replace="~{notification/fragments/style :: mailCss}"/>
</head>
<body>
  <div class="preheader">Mã OTP của bạn – hiệu lực 5 phút.</div>
  <div class="wrap">
    <th:block th:replace="~{notification/fragments/header :: brand(headerBg=${'#1a237e'})}"/>
    <div class="inner" style="text-align:center;">
      <p class="info">Mã xác thực của bạn</p>
      <div class="otpbox">
        <div class="otp-label">OTP</div>
        <div class="otp" th:text="${otp}">000000</div>
      </div>
      <p class="info">
        Mã có hiệu lực trong <strong>5 phút</strong>.<br/>
        Vui lòng không chia sẻ mã này với bất kỳ ai.
      </p>
      <div class="warnbox" style="text-align:left;">
        Nếu bạn không yêu cầu mã này, hãy bỏ qua email này.
      </div>
    </div>
    <th:block th:replace="~{notification/fragments/footer :: footer}"/>
  </div>
</body>
</html>
