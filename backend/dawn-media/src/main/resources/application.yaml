server:
  port: ${SERVER_PORT:8091}
  shutdown: graceful

logging:
  config: classpath:logback-service.xml

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    import: 'optional:file:.env[.properties]'
  application:
    name: dawn-media
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

app:
  s3:
    endpoint: ${S3_ENDPOINT:http://seaweedfs:8333}
    access-key: ${S3_ACCESS_KEY:any}
    secret-key: ${S3_SECRET_KEY:any}
    bucket: ${S3_BUCKET:pc-retail-media}
    public-url: ${S3_PUBLIC_URL:http://localhost:8333/pc-retail-media}
    region: ${S3_REGION:us-east-1}
  internal:
    token: ${INTERNAL_TOKEN:}
  jwt:
    issuer: ${JWT_ISSUER:pc-retail}
    key-id: ${JWT_KEY_ID:pc-retail}
    public-key: ${JWT_PUBLIC_KEY}
  jwtCookieName: ${JWT_COOKIE_NAME}
  jwtRefreshCookieName: ${JWT_REFRESH_COOKIE_NAME}
  jwtExpirationsMs: ${JWT_EXPIRATION_MS}
  jwtRefreshExpirationsMs: ${JWT_REFRESH_EXPIRATION_MS}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://zipkin:9411/api/v2/spans}
