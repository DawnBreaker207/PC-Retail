server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

logging:
  config: classpath:logback-service.xml

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    import: 'optional:file:.env[.properties]'
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: ${DB_DRIVER}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASS}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USER}
    password: ${MAIL_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:4200}
  mail:
    from: ${MAIL_FROM}
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}
  internal:
    token: ${INTERNAL_TOKEN:}
  services:
    mode: distributed
    order-url: ${ORDER_SERVICE_URL:http://localhost:8081}
  opt:
    ttlMinutes: 5
    cooldownSeconds: 60
  passwordResetExpirationMinutes: 15
  jwtCookieName: ${JWT_COOKIE_NAME}
  jwtRefreshCookieName: ${JWT_REFRESH_COOKIE_NAME}
  jwtSecret: ${JWT_SECRET}
  jwtExpirationsMs: ${JWT_EXPIRATION_MS}
  jwtRefreshExpirationsMs: ${JWT_REFRESH_EXPIRATION_MS}
