server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

logging:
  config: classpath:logback-service.xml

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    import: 'optional:file:.env[.properties]'
  application:
    name: dawn-payment
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 20000
      idle-timeout: 300000
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: ${DB_DRIVER}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_payment
    validate-on-migrate: false
    baseline-on-migrate: true
    baseline-version: '0'
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: basic
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:4200}
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}
  internal:
    token: ${INTERNAL_TOKEN:dawn-internal-secret}
  services:
    mode: distributed
    order-url: ${ORDER_SERVICE_URL:http://localhost:8081}
  jwtCookieName: ${JWT_COOKIE_NAME}
  jwtRefreshCookieName: ${JWT_REFRESH_COOKIE_NAME}
  jwtExpirationsMs: ${JWT_EXPIRATION_MS}
  jwtRefreshExpirationsMs: ${JWT_REFRESH_EXPIRATION_MS}
  jwt:
    issuer: ${JWT_ISSUER:pc-retail}
    key-id: ${JWT_KEY_ID:pc-retail}
    public-key: ${JWT_PUBLIC_KEY}

resilience4j:
  circuitbreaker:
    instances:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
  timelimiter:
    instances:
      default:
        timeout-duration: 10s
  bulkhead:
    instances:
      default:
        max-concurrent-calls: 20
        max-wait-duration: 100ms

payment:
  VNPay:
    url: ${VNPAY_URL}
    queryUrl: ${VNPAY_QUERY_URL}
    tmnCode: ${VNPAY_TMN_CODE}
    secretKey: ${VNPAY_SECRET_KEY}
    returnUrl: ${VNPAY_RETURN_URL}
    version: ${VNPAY_VERSION}
    command: ${VNPAY_COMMAND}
    orderType: ${VNPAY_ORDER_TYPE}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://zipkin:9411/api/v2/spans}
