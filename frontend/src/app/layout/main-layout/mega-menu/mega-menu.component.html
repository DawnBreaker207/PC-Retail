<nav class="hidden lg:block fixed top-24 left-0 right-0 z-40 bg-primary shadow-sm">
  <div class="max-w-screen-2xl mx-auto flex items-center h-10 px-4">
    <div class="relative">
      <button
        type="button"
        (click)="onCategoryClick()"
        (mouseenter)="onCategoryHoverEnter()"
        (mouseleave)="onCategoryHoverLeave()"
        class="relative z-50 flex items-center gap-1.5 text-white/90 hover:text-white px-3 py-1.5 rounded hover:bg-white/10 transition-colors text-sm font-medium mr-2"
      >
        <span nz-icon nzType="appstore" nzTheme="fill" class="text-sm"></span>
        <span>Danh mục</span>
        <span nz-icon nzType="down" nzTheme="outline" class="text-[11px] transition-transform" [class.rotate-180]="menu.isOpen()"></span>
      </button>

      @if (menu.isOpen()) {
        <div class="fixed inset-0 z-40 bg-black/40" (click)="menu.close()"></div>
        @if (!isHomeRoute()) {
          <div class="absolute top-full left-0 mt-1 z-50">
            <app-category-sidebar />
          </div>
        }
      }
    </div>

    <a routerLink="/pc-builder" class="flex items-center gap-1.5 text-white px-3 py-1.5 rounded bg-white/15 hover:bg-white/25 transition-colors text-sm font-semibold mr-6">
      <span nz-icon nzType="build" nzTheme="fill" class="text-sm"></span>
      <span>Build PC</span>
    </a>

    @for (cat of categories(); track cat.slug) {
      <div class="group relative h-full flex items-center">
        <a
          [routerLink]="['/products']"
          [queryParams]="{ category: cat.slug }"
          class="flex items-center gap-1.5 text-white/85 hover:text-white px-3 py-2.5 text-sm font-medium hover:bg-white/10 transition-colors whitespace-nowrap h-full"
        >
          <span nz-icon [nzType]="cat.icon" nzTheme="outline" class="text-sm"></span>
          <span>{{ cat.label }}</span>
        </a>

        @if (cat.children) {
          <div class="absolute top-full left-0 hidden group-hover:block pt-1 z-50">
            <div class="bg-surface dark:bg-surface-dark rounded-xl shadow-2xl border border-border/80 dark:border-border-dark/80 p-6 min-w-[500px] max-w-[90vw] animate-slide-down">
              <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                @for (col of cat.children; track col.title) {
                  <div>
                    <p class="font-semibold text-xs text-primary uppercase tracking-wider mb-3">{{ col.title }}</p>
                    <ul class="space-y-2">
                      @for (item of col.items; track item.label) {
                        <li>
                          <a
                            [routerLink]="['/products']"
                            [queryParams]="item.queryParams"
                            class="text-sm text-muted dark:text-muted-dark hover:text-primary transition-[color,transform] inline-block hover:translate-x-0.5 duration-200"
                          >
                            {{ item.label }}
                          </a>
                        </li>
                      }
                    </ul>
                  </div>
                }
              </div>
            </div>
          </div>
        }
      </div>
    }
  </div>
</nav>
