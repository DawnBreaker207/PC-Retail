<nav class="hidden lg:block bg-primary shadow-sm">
  <div class="max-w-screen-2xl mx-auto flex items-center h-10 px-4">
    <a routerLink="/products" class="flex items-center gap-1.5 text-white/90 hover:text-white px-3 py-1.5 rounded hover:bg-white/10 transition-colors text-sm font-medium mr-6">
      <span nz-icon nzType="appstore" nzTheme="fill" class="text-sm"></span>
      <span>Danh mục</span>
      <span nz-icon nzType="down" nzTheme="outline" class="text-[10px]"></span>
    </a>

    @for (cat of categories(); track cat.slug) {
      <div class="group relative h-full flex items-center">
        <a
          [routerLink]="['/products']"
          [queryParams]="{ category: cat.slug }"
          class="flex items-center gap-1.5 text-white/85 hover:text-white px-3 py-2.5 text-sm font-medium hover:bg-white/10 transition-colors whitespace-nowrap h-full"
        >
          <span nz-icon [nzType]="cat.icon" nzTheme="outline" class="text-sm"></span>
          <span>{{ cat.label }}</span>
        </a>

        @if (cat.children) {
          <div class="absolute top-full left-0 hidden group-hover:block pt-1 z-50">
            <div class="bg-white dark:bg-surface-dark rounded-xl shadow-2xl border border-border/80 dark:border-border-dark/80 p-6 min-w-[600px] animate-slide-down">
              <div class="grid grid-cols-4 gap-6">
                @for (col of cat.children; track col.title) {
                  <div>
                    <p class="font-semibold text-xs text-primary uppercase tracking-wider mb-3">{{ col.title }}</p>
                    <ul class="space-y-2">
                      @for (item of col.items; track item.slug) {
                        <li>
                          <a
                            [routerLink]="['/products']"
                            [queryParams]="{ category: item.slug }"
                            class="text-sm text-muted dark:text-muted-dark hover:text-primary transition-colors inline-block hover:translate-x-0.5 duration-200"
                          >
                            {{ item.label }}
                          </a>
                        </li>
                      }
                    </ul>
                  </div>
                }
              </div>
            </div>
          </div>
        }
      </div>
    }
  </div>
</nav>
