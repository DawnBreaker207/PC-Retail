<nz-header class="!bg-surface/80 dark:!bg-surface-dark/80 backdrop-blur-md border-b border-border/60 dark:border-border-dark/60 shadow-sm transition-[background-color,backdrop-filter] duration-300 w-full">
  <div class="h-16 flex items-center justify-between px-6 gap-6 w-full">
    <!-- LEFT SIDE: Breadcrumb -->
    <div class="flex items-center gap-6 flex-1 min-w-0">
      <div class="hidden md:block">
        <nz-breadcrumb [nzSeparator]="iconTemplate">
          <ng-template #iconTemplate>
            <span nz-icon nzType="right" class="text-xs text-muted dark:text-muted-dark"></span>
          </ng-template>
          <nz-breadcrumb-item>
            <a routerLink="/admin" class="text-muted dark:text-muted-dark hover:text-primary transition-colors">Admin</a>
          </nz-breadcrumb-item>
          <nz-breadcrumb-item>
            <span class="font-semibold text-ink dark:text-ink-dark">{{ pageLabel() }}</span>
          </nz-breadcrumb-item>
        </nz-breadcrumb>
      </div>
    </div>

    <!-- RIGHT SIDE: Notify - Theme - Profile -->
    <div class="flex items-center gap-3 sm:gap-4 shrink-0">
      <a
        routerLink="/admin"
        class="relative w-10 h-10 rounded-full bg-bg dark:bg-bg-dark border border-border/60 dark:border-border-dark/60 flex items-center justify-center cursor-pointer text-muted dark:text-muted-dark hover:text-primary hover:bg-primary-light transition-colors shadow-sm"
        aria-label="Việc cần xử lý"
        nz-tooltip
        nzTooltipTitle="Xem Work Queue"
      >
        <nz-badge [nzCount]="notificationCount()" [nzShowZero]="false" nzSize="small">
          <span nz-icon nzType="bell" class="text-xl text-muted dark:text-muted-dark"></span>
        </nz-badge>
      </a>

      <button
        type="button"
        (click)="toggleTheme()"
        aria-label="Chuyển giao diện"
        class="w-10 h-10 rounded-full bg-bg dark:bg-bg-dark border border-border/60 dark:border-border-dark/60 flex items-center justify-center text-muted dark:text-muted-dark hover:text-primary hover:bg-primary-light transition-colors shadow-sm"
      >
        <span nz-icon [nzType]="isDark() ? 'sun' : 'moon'"></span>
      </button>

      <!-- Divider -->
      <div class="h-8 w-px bg-border dark:bg-border-dark hidden sm:block"></div>

      <div nz-dropdown [nzDropdownMenu]="userMenu" nzPlacement="bottomRight">
        <div class="flex items-center gap-2 cursor-pointer">
          <nz-avatar [nzText]="userInitials" nzSize="small" class="!bg-primary"></nz-avatar>
          <span class="text-sm font-medium hidden sm:inline">{{ userName }}</span>
        </div>
      </div>
      <nz-dropdown-menu #userMenu="nzDropdownMenu">
        <ul nz-menu class="!bg-surface dark:!bg-surface-dark !border !border-border dark:!border-border-dark">
          <li nz-menu-item routerLink="/admin" class="!text-ink dark:!text-ink-dark hover:!bg-bg dark:hover:!bg-white/5"><span nz-icon nzType="dashboard"></span> Dashboard</li>
          <li nz-menu-item routerLink="/admin/account" class="!text-ink dark:!text-ink-dark hover:!bg-bg dark:hover:!bg-white/5"><span nz-icon nzType="user"></span> Tài khoản của tôi</li>
          <li nz-menu-divider class="!border-border/60 dark:!border-border-dark/60"></li>
          <li nz-menu-item (click)="logout()" (keydown.enter)="logout()" tabindex="0" class="!text-error hover:!bg-bg dark:hover:!bg-white/5"><span nz-icon nzType="logout"></span> Đăng xuất</li>
        </ul>
      </nz-dropdown-menu>
    </div>
  </div>
</nz-header>
