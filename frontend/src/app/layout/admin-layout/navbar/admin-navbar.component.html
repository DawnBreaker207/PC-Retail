<header class="h-16 bg-surface dark:bg-surface-dark border-b border-border/80 dark:border-border-dark shadow-2xs transition-colors duration-200 w-full flex items-center justify-between px-6 gap-6">
  <!-- LEFT SIDE: Breadcrumb (Pure Tailwind + Lucide) -->
  <div class="flex items-center gap-6 flex-1 min-w-0">
    <nav aria-label="Breadcrumb" class="hidden md:flex items-center gap-2 text-xs">
      <a routerLink="/admin" class="text-muted dark:text-muted-dark hover:text-primary transition-colors font-medium">Admin</a>
      <lucide-angular [img]="ChevronRight" class="w-3.5 h-3.5 text-muted dark:text-muted-dark" />
      <span class="font-bold text-ink dark:text-ink-dark">{{ pageLabel() }}</span>
    </nav>
  </div>

  <!-- RIGHT SIDE: Notify - Theme - Profile -->
  <div class="flex items-center gap-3 sm:gap-4 shrink-0">
    <!-- Work Queue Bell -->
    <a
      routerLink="/admin"
      class="relative w-10 h-10 rounded-full bg-bg dark:bg-bg-dark border border-border/80 dark:border-border-dark flex items-center justify-center cursor-pointer text-muted dark:text-muted-dark hover:text-primary dark:hover:text-primary hover:bg-primary-light/40 dark:hover:bg-white/10 transition-colors shadow-2xs"
      aria-label="Việc cần xử lý"
      title="Xem Work Queue"
    >
      <lucide-angular [img]="Bell" class="w-4.5 h-4.5" />
      @if (notificationCount() > 0) {
        <span
          hlmBadge
          variant="destructive"
          class="absolute -top-1 -right-1 text-[10px] font-bold px-1.5 py-0 h-4.5 min-w-[18px] flex items-center justify-center rounded-full"
        >
          {{ notificationCount() }}
        </span>
      }
    </a>

    <!-- Theme Toggle -->
    <button
      type="button"
      (click)="toggleTheme()"
      aria-label="Chuyển giao diện sáng/tối"
      title="Chuyển giao diện sáng/tối"
      class="w-10 h-10 rounded-full bg-bg dark:bg-bg-dark border border-border/80 dark:border-border-dark flex items-center justify-center text-muted dark:text-muted-dark hover:text-primary dark:hover:text-primary hover:bg-primary-light/40 dark:hover:bg-white/10 transition-colors shadow-2xs cursor-pointer"
    >
      <lucide-angular [img]="isDark() ? Sun : Moon" class="w-4.5 h-4.5" />
    </button>

    <!-- Divider -->
    <div class="h-8 w-px bg-border/80 dark:border-border-dark hidden sm:block"></div>

    <!-- User Profile Dropdown Menu (Spartan UI Style) -->
    <div class="relative">
      <button
        type="button"
        (click)="toggleUserMenu()"
        class="flex items-center gap-2.5 p-1 rounded-xl hover:bg-bg dark:hover:bg-bg-dark transition-colors cursor-pointer"
      >
        <div class="w-8 h-8 rounded-full bg-primary/10 text-primary font-bold text-xs flex items-center justify-center border border-primary/25">
          {{ userInitials }}
        </div>
        <span class="text-sm font-semibold hidden sm:inline text-ink dark:text-ink-dark">{{ userName }}</span>
      </button>

      @if (userMenuOpen()) {
        <div class="fixed inset-0 z-40" (click)="userMenuOpen.set(false)"></div>
        <div class="absolute right-0 mt-2 w-52 bg-surface dark:bg-surface-dark border border-border/80 dark:border-border-dark rounded-xl shadow-xl p-1.5 z-50 animate-scale-in">
          <a
            routerLink="/admin"
            (click)="userMenuOpen.set(false)"
            class="flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-medium text-ink dark:text-ink-dark hover:bg-bg dark:hover:bg-white/5 transition-colors"
          >
            <lucide-angular [img]="LayoutDashboard" class="w-4 h-4 text-muted dark:text-muted-dark" />
            <span>Bảng tin quản trị</span>
          </a>
          <a
            routerLink="/admin/account"
            (click)="userMenuOpen.set(false)"
            class="flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-medium text-ink dark:text-ink-dark hover:bg-bg dark:hover:bg-white/5 transition-colors"
          >
            <lucide-angular [img]="User" class="w-4 h-4 text-muted dark:text-muted-dark" />
            <span>Tài khoản của tôi</span>
          </a>
          <div class="h-px bg-border/60 dark:border-border-dark/60 my-1"></div>
          <button
            type="button"
            hlmBtn
            variant="ghost"
            size="sm"
            (click)="logout(); userMenuOpen.set(false)"
            class="w-full justify-start text-error hover:text-error hover:bg-error/10"
          >
            <lucide-angular [img]="LogOut" class="w-4 h-4" />
            <span>Đăng xuất</span>
          </button>
        </div>
      }
    </div>
  </div>
</header>
