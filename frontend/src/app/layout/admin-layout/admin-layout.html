<div class="flex h-screen w-full overflow-hidden bg-bg dark:bg-bg-dark">
  <!-- SIDER -->
  <app-admin-sidebar [isCollapsed]="isCollapsed" (triggerCollapsed)="toggleCollapse($event)" />

  <!-- MAIN RIGHT AREA -->
  <div class="flex flex-1 flex-col overflow-hidden min-w-0">
    <!-- NAVBAR -->
    <div class="shrink-0 z-40">
      <app-admin-navbar [pageLabel]="pageLabel()" />
    </div>

    <!-- CONTENT AREA -->
    <main class="flex-1 overflow-y-auto overflow-x-hidden p-6 bg-bg dark:bg-bg-dark">
      <router-outlet />
    </main>
  </div>
</div>
