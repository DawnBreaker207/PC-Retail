<nz-layout class="ant-layout-has-sider h-screen w-full overflow-hidden">
  <!-- SIDER -->
  <app-admin-sidebar [isCollapsed]="isCollapsed" (triggerCollapsed)="toggleCollapse($event)" />

  <!-- LAYOUT RIGHT -->
  <nz-layout class="flex flex-col overflow-hidden">
    <!-- NAVBAR -->
    <nz-header class="!p-0 shrink-0 z-40">
      <app-admin-navbar [pageLabel]="pageLabel()" />
    </nz-header>

    <!-- CONTENT AREA -->
    <nz-content class="flex-1 overflow-y-auto overflow-x-hidden !bg-bg dark:!bg-bg-dark p-6">
      <router-outlet />
    </nz-content>
  </nz-layout>
</nz-layout>
