<nz-sider
  nzCollapsible
  [nzCollapsed]="isCollapsed()"
  [nzTrigger]="triggerTemplate"
  (nzCollapsedChange)="triggerCollapsed.emit($event)"
  nzWidth="260px"
  nzBreakpoint="lg"
  [nzCollapsedWidth]="72"
  nzTheme="light"
  class="shadow-[4px_0_24px_rgba(0,0,0,0.02)] z-20 h-full border-r border-border/60 dark:border-border-dark/60 hidden md:block !bg-surface dark:!bg-surface-dark flex flex-col"
>
  <div class="h-16 shrink-0 flex items-center justify-center border-b border-border/60 dark:border-border-dark/60 sticky top-0 !bg-surface dark:!bg-surface-dark z-10">
    <a routerLink="/admin" class="flex items-center gap-3 text-decoration-none">
      <div class="w-9 h-9 rounded-xl bg-primary flex items-center justify-center shadow-md shadow-primary/30">
        <span nz-icon nzType="thunderbolt" nzTheme="fill" class="text-base text-white"></span>
      </div>
      <h1
        class="text-lg font-black tracking-tight text-ink dark:text-ink-dark m-0 overflow-hidden whitespace-nowrap transition-[max-width,opacity] duration-200 ease-out"
        [class]="isCollapsed() ? 'max-w-0 opacity-0' : 'max-w-[180px] opacity-100'"
      >
        PC <span class="text-primary">ADMIN</span>
      </h1>
    </a>
  </div>

  <div class="p-3 flex-1 min-h-0 overflow-y-auto custom-scrollbar">
    <ul nz-menu nzTheme="light" nzMode="inline" [nzInlineCollapsed]="isCollapsed()" class="border-r-0 !bg-transparent space-y-1">
      @for (section of navSections; track section.title) {
        <li class="sidebar-section relative h-7 mt-3 mx-1 pointer-events-none select-none overflow-hidden">
          <span
            class="absolute inset-0 flex items-center px-3 text-[11px] font-bold uppercase tracking-wider text-muted dark:text-muted-dark whitespace-nowrap transition-opacity duration-200"
            [class.opacity-0]="isCollapsed()"
          >
            {{ section.title }}
          </span>
          <span
            class="absolute inset-y-0 left-2 right-2 my-auto h-px bg-border dark:bg-border-dark transition-opacity duration-200"
            [class.opacity-0]="!isCollapsed()"
          ></span>
        </li>
        @for (item of section.items; track item.route) {
          <li
            nz-menu-item
            [nzSelected]="isActive(item.route)"
            [routerLink]="[item.route]"
            class="rounded-xl font-medium text-ink/70 dark:text-ink-dark/70 hover:text-primary hover:bg-primary-light/50 transition-colors"
          >
            <span nz-icon [nzType]="item.icon" nzTheme="outline" class="text-lg"></span>
            <span>{{ item.label }}</span>
            @if (badgeCount(item) > 0) {
              <nz-badge [nzCount]="badgeCount(item)" class="!ml-2"></nz-badge>
            }
          </li>
        }
      }
    </ul>
  </div>
</nz-sider>

<ng-template #triggerTemplate>
  <span
    nz-icon
    [nzType]="isCollapsed() ? 'double-right' : 'double-left'"
    class="text-lg"
    nz-tooltip
    [nzTooltipTitle]="isCollapsed() ? 'Mở rộng menu' : 'Thu gọn menu'"
    [@iconFade]="isCollapsed() ? 'closed' : 'open'"
  ></span>
</ng-template>
