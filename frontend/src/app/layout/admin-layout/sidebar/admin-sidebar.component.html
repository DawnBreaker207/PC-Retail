<aside
  class="h-full border-r border-border/80 dark:border-border-dark bg-surface dark:bg-surface-dark flex flex-col transition-all duration-300 z-20 shrink-0 select-none shadow-2xs"
  [class.w-64]="!isCollapsed()"
  [class.w-20]="isCollapsed()"
>
  <!-- Brand Logo & Header -->
  <div class="h-16 shrink-0 flex items-center justify-between px-4 border-b border-border/80 dark:border-border-dark">
    <a routerLink="/admin" class="flex items-center gap-3 overflow-hidden">
      <div class="w-9 h-9 rounded-xl bg-primary flex items-center justify-center shadow-sm shadow-primary/30 shrink-0">
        <lucide-angular [img]="Zap" class="w-5 h-5 text-white" />
      </div>
      @if (!isCollapsed()) {
        <h1 class="text-base font-black tracking-tight text-ink dark:text-ink-dark m-0 whitespace-nowrap transition-opacity duration-200">
          PC <span class="text-primary">ADMIN</span>
        </h1>
      }
    </a>
  </div>

  <!-- Navigation Sections List -->
  <div class="p-3 flex-1 min-h-0 overflow-y-auto space-y-4">
    @for (section of navSections; track section.title) {
      <div class="space-y-1">
        @if (!isCollapsed()) {
          <div class="px-3 py-1 text-[10px] font-bold uppercase tracking-wider text-muted dark:text-muted-dark">
            {{ section.title }}
          </div>
        } @else {
          <div class="my-2 h-px bg-border/60 dark:border-border-dark/60"></div>
        }

        @for (item of section.items; track item.route) {
          <a
            [routerLink]="[item.route]"
            class="flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-semibold transition-all group"
            [ngClass]="isActive(item.route)
              ? 'bg-primary text-white shadow-2xs'
              : 'text-ink/80 dark:text-ink-dark/80 hover:bg-bg dark:hover:bg-white/5 hover:text-primary'"
            [hlmTooltip]="isCollapsed() ? item.label : ''"
            tooltipPosition="right"
          >
            <lucide-angular [img]="item.icon" class="w-4.5 h-4.5 shrink-0" />
            @if (!isCollapsed()) {
              <span class="truncate flex-1">{{ item.label }}</span>
              @if (badgeCount(item) > 0) {
                <span
                  hlmBadge
                  [variant]="isActive(item.route) ? 'secondary' : 'destructive'"
                  class="ml-auto text-[10px] font-bold px-1.5 py-0 h-4.5 min-w-[18px] flex items-center justify-center rounded-full"
                  [class.text-white]="!isActive(item.route)"
                >
                  {{ badgeCount(item) }}
                </span>
              }
            }
          </a>
        }
      </div>
    }
  </div>

  <!-- Bottom Collapse Toggle Bar -->
  <div class="p-3 border-t border-border/80 dark:border-border-dark flex items-center justify-center shrink-0">
    <button
      hlmBtn
      variant="outline"
      size="sm"
      type="button"
      (click)="toggleCollapse()"
      class="w-full flex items-center justify-center gap-2 text-xs font-semibold cursor-pointer"
      [hlmTooltip]="isCollapsed() ? 'Mở rộng sidebar' : 'Thu gọn sidebar'"
      [tooltipPosition]="isCollapsed() ? 'right' : 'top'"
    >
      <lucide-angular [img]="isCollapsed() ? ChevronRight : ChevronLeft" class="w-4 h-4" />
      @if (!isCollapsed()) {
        <span>Thu gọn sidebar</span>
      }
    </button>
  </div>
</aside>
