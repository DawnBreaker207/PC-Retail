<div class="max-w-screen-2xl mx-auto px-4 py-6 lg:py-8">
  <nav aria-label="Breadcrumb" class="mb-4 flex items-center gap-1.5 text-xs text-muted dark:text-muted-dark">
    <a routerLink="/" class="hover:text-primary transition-colors">Trang chủ</a>
    <lucide-icon [img]="ChevronRightIcon" class="size-3.5 text-muted/60" />
    <span class="text-foreground font-semibold">Sản phẩm yêu thích</span>
  </nav>

  <h1 class="text-lg lg:text-xl font-bold mb-5 text-foreground">Sản phẩm yêu thích ({{ products().length }})</h1>

  @if (products().length === 0) {
    <app-empty-state
      title="Bạn chưa thêm sản phẩm yêu thích nào"
      description="Bấm vào biểu tượng trái tim trên sản phẩm để lưu lại tại đây."
      actionLabel="Khám phá sản phẩm"
      actionRoute="/products"
    />
  } @else {
    <div class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-5 gap-3 sm:gap-4">
      @for (product of products(); track product.id) {
        <app-product-card [product]="product" (addToCart)="addToCart(product.id)" />
      }
    </div>
  }
</div>
