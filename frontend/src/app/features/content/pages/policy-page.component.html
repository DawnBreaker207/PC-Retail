@if (content(); as c) {
  <div class="max-w-3xl mx-auto px-4 py-6 lg:py-8">
    <nav hlmBreadcrumb class="mb-4">
      <a hlmBreadcrumbLink routerLink="/">Trang chủ</a>
      <span class="text-muted/40 dark:text-muted-dark/40">/</span>
      <span hlmBreadcrumbCurrent>{{ c.title }}</span>
    </nav>

    <h1 class="text-xl lg:text-2xl font-bold mb-6">{{ c.title }}</h1>

    <div class="flex flex-col gap-6">
      @for (section of c.sections; track section.heading) {
        <div>
          <h2 class="text-base font-semibold mb-2">{{ section.heading }}</h2>
          <p class="text-sm text-muted dark:text-muted-dark leading-relaxed">{{ section.body }}</p>
        </div>
      }
    </div>
  </div>
} @else {
  <div class="max-w-3xl mx-auto px-4 py-16 text-center text-muted dark:text-muted-dark">
    Không tìm thấy nội dung chính sách.
  </div>
}
