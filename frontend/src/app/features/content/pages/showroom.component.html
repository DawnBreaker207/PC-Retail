<div class="max-w-screen-2xl mx-auto px-4 py-6 lg:py-8">
  <nav hlmBreadcrumb class="mb-4">
    <a hlmBreadcrumbLink routerLink="/">Trang chủ</a>
    <span class="text-muted/40 dark:text-muted-dark/40">/</span>
    <span hlmBreadcrumbCurrent>Hệ thống showroom</span>
  </nav>

  <h1 class="text-xl lg:text-2xl font-bold mb-6">Hệ thống showroom</h1>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    @for (s of showrooms; track s.name) {
      <div class="rounded-xl border border-border/80 dark:border-border-dark/80 bg-surface dark:bg-surface-dark shadow-sm p-4">
        <h2 class="text-base font-semibold mb-3 text-ink dark:text-ink-dark">{{ s.name }}</h2>
        <ul class="space-y-2.5 text-sm text-muted dark:text-muted-dark">
          <li class="flex items-start gap-2.5">
            <lucide-angular [img]="MapPin" class="w-4 h-4 mt-0.5 shrink-0 text-primary" />
            <span>{{ s.address }}</span>
          </li>
          <li class="flex items-start gap-2.5">
            <lucide-angular [img]="Phone" class="w-4 h-4 mt-0.5 shrink-0 text-primary" />
            <span>{{ s.phone }}</span>
          </li>
          <li class="flex items-start gap-2.5">
            <lucide-angular [img]="Clock" class="w-4 h-4 mt-0.5 shrink-0 text-primary" />
            <span>{{ s.hours }}</span>
          </li>
        </ul>
      </div>
    }
  </div>
</div>
