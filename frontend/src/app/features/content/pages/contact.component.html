<div class="max-w-3xl mx-auto px-4 py-6 lg:py-8">
  <nav hlmBreadcrumb class="mb-4">
    <a hlmBreadcrumbLink routerLink="/">Trang chủ</a>
    <span class="text-muted/40 dark:text-muted-dark/40">/</span>
    <span hlmBreadcrumbCurrent>Liên hệ</span>
  </nav>

  <h1 class="text-xl lg:text-2xl font-bold mb-6">Liên hệ với DAWN PC Retail</h1>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    <ul class="space-y-4 text-sm">
      <li class="flex items-start gap-3">
        <lucide-angular [img]="Phone" class="mt-0.5 shrink-0 text-primary w-5 h-5" />
        <span class="text-muted dark:text-muted-dark">Hotline: <span class="text-ink dark:text-ink-dark font-semibold">1900 5301</span></span>
      </li>
      <li class="flex items-start gap-3">
        <lucide-angular [img]="Mail" class="mt-0.5 shrink-0 text-primary w-5 h-5" />
        <span class="text-muted dark:text-muted-dark">Email: support&#64;dawn.vn</span>
      </li>
      <li class="flex items-start gap-3">
        <lucide-angular [img]="MapPin" class="mt-0.5 shrink-0 text-primary w-5 h-5" />
        <span class="text-muted dark:text-muted-dark">123 Đường ABC, Quận Hà Đông, Hà Nội</span>
      </li>
    </ul>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
      <div>
        <label hlmLabel class="block text-xs font-medium text-ink dark:text-ink-dark mb-1.5">Họ và tên</label>
        <input hlmInput formControlName="fullName" placeholder="Nhập họ và tên của bạn" class="w-full" />
      </div>

      <div>
        <label hlmLabel class="block text-xs font-medium text-ink dark:text-ink-dark mb-1.5">Số điện thoại</label>
        <input hlmInput formControlName="phone" placeholder="Nhập số điện thoại liên hệ" class="w-full" />
      </div>

      <div>
        <label hlmLabel class="block text-xs font-medium text-ink dark:text-ink-dark mb-1.5">Nội dung yêu cầu</label>
        <textarea
          hlmTextarea
          formControlName="content"
          rows="4"
          placeholder="Bạn cần hỗ trợ gì?"
          class="w-full"
        ></textarea>
      </div>

      <button hlmBtn type="submit" [disabled]="form.invalid" class="w-fit px-6">
        <lucide-angular [img]="Send" class="w-4 h-4 mr-2" />
        Gửi yêu cầu
      </button>
    </form>
  </div>
</div>
