<div class="max-w-3xl mx-auto px-4 py-6 lg:py-8">
  <nav hlmBreadcrumb class="mb-4">
    <a hlmBreadcrumbLink routerLink="/">Trang chủ</a>
    <span class="text-muted/40 dark:text-muted-dark/40">/</span>
    <span hlmBreadcrumbCurrent>Câu hỏi thường gặp</span>
  </nav>

  <h1 class="text-xl lg:text-2xl font-bold mb-6">Câu hỏi thường gặp</h1>

  <div class="space-y-3">
    @for (item of faqs; track item.q) {
      <div class="rounded-card border border-border/80 dark:border-border-dark/80 bg-surface dark:bg-surface-dark overflow-hidden transition-colors">
        <button
          type="button"
          (click)="toggle($index)"
          class="w-full flex items-center justify-between p-4 text-left font-medium text-sm text-ink dark:text-ink-dark hover:text-primary transition-colors focus:outline-none"
        >
          <span>{{ item.q }}</span>
          <lucide-angular
            [img]="ChevronDown"
            class="w-4 h-4 text-muted shrink-0 transition-transform duration-200"
            [class.rotate-180]="isOpen($index)"
          />
        </button>
        @if (isOpen($index)) {
          <div class="px-4 pb-4 pt-1 text-sm text-muted dark:text-muted-dark border-t border-border/40 dark:border-border-dark/40 leading-relaxed animate-fade-in">
            {{ item.a }}
          </div>
        }
      </div>
    }
  </div>
</div>
