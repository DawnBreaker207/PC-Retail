<div class="bg-surface dark:bg-surface-dark py-8 lg:py-10 mt-8 lg:mt-10 border-y border-border/60 dark:border-border-dark/60">
  <div class="max-w-screen-2xl mx-auto px-4">
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-3">
        <div class="h-6 w-1.5 bg-primary rounded-full"></div>
        <h2 class="text-lg lg:text-xl font-bold tracking-tight uppercase text-foreground">Danh mục sản phẩm</h2>
      </div>
      <a routerLink="/products" class="text-xs sm:text-sm text-primary font-bold hover:underline transition-colors">
        Xem tất cả danh mục →
      </a>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-3 sm:gap-4">
      @for (cat of categories; track cat.id) {
        <a
          [routerLink]="['/products']"
          [queryParams]="{ category: cat.slug }"
          class="flex flex-col items-center gap-2.5 p-3.5 rounded-2xl bg-bg dark:bg-bg-dark border border-border/60 dark:border-border-dark/60 hover:border-primary/50 dark:hover:border-primary/50 hover:shadow-md hover:shadow-primary/5 transition-all duration-300 group"
        >
          <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-xl overflow-hidden bg-surface dark:bg-surface-dark p-1 border border-border/40 group-hover:scale-108 transition-transform duration-300 shadow-2xs">
            <img [src]="cat.imageUrl" loading="lazy" appFallbackImage [alt]="cat.name" class="w-full h-full object-cover rounded-lg" />
          </div>
          <span class="text-xs text-center text-ink dark:text-ink-dark group-hover:text-primary leading-tight line-clamp-1 font-semibold">{{ cat.name }}</span>
        </a>
      }
    </div>
  </div>
</div>
