<div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-3">
  @for (cat of categories; track cat.label) {
    <a
      [routerLink]="['/products']"
      [queryParams]="{ category: cat.slug }"
      class="group relative flex flex-col items-center justify-center p-3.5 sm:p-4 rounded-2xl bg-surface dark:bg-surface-dark border border-border/70 dark:border-border-dark/70 transition-all duration-300 hover:-translate-y-1 hover:border-primary/50 hover:shadow-lg hover:shadow-primary/5 text-center min-h-[140px]"
    >
      <div
        class="w-12 h-12 rounded-xl flex items-center justify-center mb-2.5 transition-transform duration-300 group-hover:scale-110 shadow-2xs"
        [class]="'border ' + cat.color"
      >
        <lucide-angular [img]="cat.icon" class="w-6 h-6" />
      </div>

      <p class="text-xs sm:text-sm font-bold leading-tight text-ink dark:text-ink-dark group-hover:text-primary transition-colors line-clamp-1">
        {{ cat.label }}
      </p>
      <p class="text-[11px] text-muted/80 dark:text-muted-dark/80 mt-1 line-clamp-1">
        {{ cat.sub }}
      </p>

      <div class="mt-2 flex items-center gap-1 text-[10px] font-semibold text-primary opacity-0 group-hover:opacity-100 transition-opacity">
        <span>Xem ngay</span>
        <lucide-angular [img]="ArrowRightIcon" class="w-3 h-3 group-hover:translate-x-0.5 transition-transform" />
      </div>
    </a>
  }
</div>
