<p class="text-sm text-muted dark:text-muted-dark mb-3">Vui lòng nhập lý do từ chối, khách hàng sẽ nhìn thấy nội dung này.</p>
<textarea
  nz-input
  rows="4"
  placeholder="Lý do từ chối (bắt buộc)"
  [(ngModel)]="reason"
  name="reason"
></textarea>

<div class="flex justify-end gap-3 mt-6">
  <button nz-button nzType="default" type="button" (click)="cancel()">Hủy</button>
  <button nz-button nzType="primary" nzDanger type="button" [disabled]="!reason.trim()" (click)="submit()">
    Từ chối yêu cầu
  </button>
</div>
