<p class="text-xs text-muted-foreground mb-3">Vui lòng nhập lý do từ chối, khách hàng sẽ nhìn thấy nội dung này.</p>
<textarea
  hlmInput
  rows="4"
  placeholder="Lý do từ chối (bắt buộc)"
  [ngModel]="reason()"
  (ngModelChange)="reason.set($event)"
  name="reason"
  class="w-full text-xs p-3 rounded-md border border-input bg-background"
></textarea>

<div class="flex justify-end gap-2 mt-4">
  <button hlmBtn variant="outline" size="sm" type="button" (click)="cancel()">Hủy</button>
  <button
    hlmBtn
    variant="destructive"
    size="sm"
    type="button"
    [disabled]="!reason().trim()"
    (click)="submit()"
    class="bg-destructive text-destructive-foreground"
  >
    Từ chối yêu cầu
  </button>
</div>
