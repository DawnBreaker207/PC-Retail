<form nz-form [formGroup]="form" (ngSubmit)="submit()">
  <nz-form-item>
    <nz-form-label nzFor="name" nzRequired>Tên danh mục</nz-form-label>
    <nz-form-control nzErrorTip="Vui lòng nhập tên danh mục">
      <input nz-input id="name" formControlName="name" placeholder="Tên danh mục" />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzFor="parentId">Danh mục cha</nz-form-label>
    <nz-form-control>
      <nz-select id="parentId" formControlName="parentId" nzPlaceHolder="Không có (danh mục gốc)" nzAllowClear>
        @for (c of parentOptions; track c.id) {
          <nz-option [nzValue]="c.id" [nzLabel]="c.name" />
        }
      </nz-select>
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzFor="icon" nzRequired>Icon (ng-zorro icon type)</nz-form-label>
    <nz-form-control nzErrorTip="Vui lòng nhập icon">
      <input nz-input id="icon" formControlName="icon" placeholder="VD: laptop, desktop, tool..." />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzFor="imageUrl">Ảnh danh mục (URL)</nz-form-label>
    <nz-form-control>
      <input nz-input id="imageUrl" formControlName="imageUrl" placeholder="https://..." />
    </nz-form-control>
  </nz-form-item>

  <div class="flex justify-end gap-3 mt-6">
    <button nz-button nzType="default" type="button" (click)="cancel()">Hủy</button>
    <button nz-button nzType="primary" type="submit" [nzLoading]="submitting()" [disabled]="form.invalid">
      {{ isEdit ? 'Lưu thay đổi' : 'Thêm danh mục' }}
    </button>
  </div>
</form>
