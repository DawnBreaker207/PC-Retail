<form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4 text-xs">
  <div>
    <label hlmLabel for="name" class="block font-medium text-foreground mb-1">
      Tên danh mục <span class="text-destructive">*</span>
    </label>
    <input
      hlmInput
      id="name"
      formControlName="name"
      placeholder="Ví dụ: Card màn hình, Bộ vi xử lý..."
      class="w-full h-9 text-xs"
    />
  </div>

  <div>
    <label hlmLabel for="parentId" class="block font-medium text-foreground mb-1">
      Danh mục cha
    </label>
    <select
      id="parentId"
      formControlName="parentId"
      class="w-full h-9 px-3 rounded-md border border-input bg-background text-foreground text-xs"
    >
      <option [ngValue]="null">Không có (Danh mục gốc cấp 1)</option>
      @for (c of parentOptions; track c.id) {
        <option [ngValue]="c.id">{{ c.name }}</option>
      }
    </select>
  </div>

  <div>
    <label hlmLabel for="icon" class="block font-medium text-foreground mb-1">
      Biểu tượng Icon (tên icon) <span class="text-destructive">*</span>
    </label>
    <input
      hlmInput
      id="icon"
      formControlName="icon"
      placeholder="VD: cpu, hard-drive, monitor..."
      class="w-full h-9 text-xs"
    />
  </div>

  <div>
    <label hlmLabel for="imageUrl" class="block font-medium text-foreground mb-1">
      Ảnh danh mục (URL)
    </label>
    <input
      hlmInput
      id="imageUrl"
      formControlName="imageUrl"
      placeholder="https://..."
      class="w-full h-9 text-xs"
    />
  </div>

  <div class="flex justify-end gap-2 pt-3 border-t border-border">
    <button hlmBtn variant="outline" size="sm" type="button" (click)="cancel()">Hủy</button>
    <button
      hlmBtn
      variant="default"
      size="sm"
      type="submit"
      [disabled]="form.invalid || submitting()"
      class="bg-primary text-white text-primary-foreground cursor-pointer"
    >
      {{ isEdit ? 'Lưu thay đổi' : 'Thêm danh mục' }}
    </button>
  </div>
</form>
