<form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4 text-xs">
  <div>
    <label hlmLabel for="name" class="block font-medium text-foreground mb-1">
      Tên sản phẩm <span class="text-destructive">*</span>
    </label>
    <input
      hlmInput
      id="name"
      formControlName="name"
      placeholder="Ví dụ: VGA NVIDIA RTX 4080 Super..."
      class="w-full h-9 text-xs"
    />
  </div>

  <div class="grid grid-cols-2 gap-3">
    <div>
      <label hlmLabel for="brandName" class="block font-medium text-foreground mb-1">
        Thương hiệu <span class="text-destructive">*</span>
      </label>
      <select
        id="brandName"
        formControlName="brandName"
        class="w-full h-9 px-3 rounded-md border border-input bg-background text-foreground text-xs"
      >
        <option value="" disabled>Chọn thương hiệu</option>
        @for (b of brands; track b.id) {
          <option [value]="b.name">{{ b.name }}</option>
        }
      </select>
    </div>

    <div>
      <label hlmLabel for="categoryName" class="block font-medium text-foreground mb-1">
        Danh mục <span class="text-destructive">*</span>
      </label>
      <select
        id="categoryName"
        formControlName="categoryName"
        class="w-full h-9 px-3 rounded-md border border-input bg-background text-foreground text-xs"
      >
        <option value="" disabled>Chọn danh mục</option>
        @for (c of categories; track c.slug) {
          <option [value]="c.name">{{ c.name }}</option>
        }
      </select>
    </div>
  </div>

  <div class="grid grid-cols-2 gap-3">
    <div>
      <label hlmLabel for="price" class="block font-medium text-foreground mb-1">
        Giá bán (VNĐ) <span class="text-destructive">*</span>
      </label>
      <input
        hlmInput
        type="number"
        id="price"
        formControlName="price"
        min="1000"
        step="10000"
        class="w-full h-9 text-xs"
      />
    </div>

    <div>
      <label hlmLabel for="originalPrice" class="block font-medium text-foreground mb-1">
        Giá gốc niêm yết (VNĐ)
      </label>
      <input
        hlmInput
        type="number"
        id="originalPrice"
        formControlName="originalPrice"
        min="0"
        step="10000"
        class="w-full h-9 text-xs"
      />
    </div>
  </div>

  <div>
    <label hlmLabel for="imageUrl" class="block font-medium text-foreground mb-1">
      Ảnh sản phẩm (URL) <span class="text-destructive">*</span>
    </label>
    <input
      hlmInput
      id="imageUrl"
      formControlName="imageUrl"
      placeholder="https://images.unsplash.com/..."
      class="w-full h-9 text-xs"
    />
  </div>

  <div>
    <label hlmLabel for="description" class="block font-medium text-foreground mb-1">
      Mô tả tóm tắt
    </label>
    <textarea
      hlmTextarea
      id="description"
      formControlName="description"
      rows="3"
      placeholder="Nhập thông số kỹ thuật tóm tắt hoặc mô tả nổi bật..."
      class="w-full text-xs"
    ></textarea>
  </div>

  <div class="grid grid-cols-2 gap-3">
    <div>
      <label hlmLabel for="status" class="block font-medium text-foreground mb-1">
        Trạng thái kinh doanh
      </label>
      <select
        id="status"
        formControlName="status"
        class="w-full h-9 px-3 rounded-md border border-input bg-background text-foreground text-xs"
      >
        <option value="ACTIVE">Đang bán</option>
        <option value="INACTIVE">Ngừng bán</option>
      </select>
    </div>

    @if (!isEdit) {
      <div>
        <label hlmLabel for="stockAvailable" class="block font-medium text-foreground mb-1">
          Tồn kho ban đầu
        </label>
        <input
          hlmInput
          type="number"
          id="stockAvailable"
          formControlName="stockAvailable"
          min="0"
          class="w-full h-9 text-xs"
        />
      </div>
    }
  </div>

  @if (isEdit) {
    <p class="text-[11px] text-muted-foreground italic">
      * Tồn kho và vị trí ô kệ được quản lý chuyên sâu tại trang Sơ đồ Kho hàng.
    </p>
  }

  <div class="flex justify-end gap-2 pt-3 border-t border-border">
    <button hlmBtn variant="outline" size="sm" type="button" (click)="cancel()">Hủy</button>
    <button
      hlmBtn
      variant="default"
      size="sm"
      type="submit"
      [disabled]="form.invalid || submitting()"
      class="bg-primary text-primary-foreground"
    >
      {{ isEdit ? 'Lưu thay đổi' : 'Thêm sản phẩm' }}
    </button>
  </div>
</form>
