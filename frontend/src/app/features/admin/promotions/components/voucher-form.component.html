<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4 text-xs">
  <div>
    <label hlmLabel for="code" class="block font-medium text-foreground mb-1">
      Mã giảm giá <span class="text-destructive">*</span>
    </label>
    <input
      hlmInput
      id="code"
      formControlName="code"
      placeholder="VD: FREESHIP50K, SALE20..."
      (input)="onCodeInput()"
      class="w-full h-9 text-xs font-mono uppercase"
    />
  </div>

  <div>
    <label hlmLabel for="scopeType" class="block font-medium text-foreground mb-1">
      Phạm vi áp dụng <span class="text-destructive">*</span>
    </label>
    <select
      id="scopeType"
      formControlName="scopeType"
      (ngModelChange)="isFreeship() ? form.patchValue({ discountType: 'FIXED' }) : null"
      class="w-full h-9 px-3 rounded-md border border-input bg-background text-foreground text-xs"
    >
      <option value="STOREWIDE">Toàn bộ cửa hàng</option>
      <option value="CATEGORY">Theo danh mục sản phẩm</option>
      <option value="PRODUCT">Theo sản phẩm cụ thể</option>
      <option value="FREESHIP">Miễn phí vận chuyển</option>
    </select>
  </div>

  @if (!isFreeship()) {
    <div>
      <label hlmLabel class="block font-medium text-foreground mb-1">Loại chiết khấu</label>
      <div class="flex items-center gap-4 py-1">
        <label class="inline-flex items-center gap-1.5 cursor-pointer text-foreground">
          <input
            type="radio"
            value="FIXED"
            formControlName="discountType"
            class="text-primary focus:ring-primary h-4 w-4"
          />
          Giảm số tiền cố định (VNĐ)
        </label>
        <label class="inline-flex items-center gap-1.5 cursor-pointer text-foreground">
          <input
            type="radio"
            value="PERCENT"
            formControlName="discountType"
            class="text-primary focus:ring-primary h-4 w-4"
          />
          Giảm theo phần trăm (%)
        </label>
      </div>
    </div>
  }

  <div class="grid grid-cols-2 gap-3">
    <div>
      <label hlmLabel for="discountValue" class="block font-medium text-foreground mb-1">
        Mức giảm <span class="text-destructive">*</span>
      </label>
      <input
        hlmInput
        type="number"
        id="discountValue"
        formControlName="discountValue"
        min="0.01"
        class="w-full h-9 text-xs"
        [placeholder]="form.value.discountType === 'PERCENT' ? 'Ví dụ: 15 (%)' : 'Ví dụ: 50000 (VNĐ)'"
      />
    </div>

    @if (form.value.discountType === 'PERCENT' && !isFreeship()) {
      <div>
        <label hlmLabel for="maxDiscountAmount" class="block font-medium text-foreground mb-1">
          Giảm tối đa (VNĐ)
        </label>
        <input
          hlmInput
          type="number"
          id="maxDiscountAmount"
          formControlName="maxDiscountAmount"
          min="0"
          step="10000"
          class="w-full h-9 text-xs"
        />
      </div>
    }
  </div>

  <div class="grid grid-cols-2 gap-3">
    <div>
      <label hlmLabel for="minOrderValue" class="block font-medium text-foreground mb-1">
        Đơn hàng tối thiểu (VNĐ)
      </label>
      <input
        hlmInput
        type="number"
        id="minOrderValue"
        formControlName="minOrderValue"
        min="0"
        step="10000"
        class="w-full h-9 text-xs"
      />
    </div>

    <div>
      <label hlmLabel for="totalQuantity" class="block font-medium text-foreground mb-1">
        Số lượng mã phát hành <span class="text-destructive">*</span>
      </label>
      <input
        hlmInput
        type="number"
        id="totalQuantity"
        formControlName="totalQuantity"
        min="1"
        class="w-full h-9 text-xs"
      />
    </div>
  </div>

  <div class="grid grid-cols-2 gap-3">
    <div>
      <label hlmLabel for="validFrom" class="block font-medium text-foreground mb-1">
        Hiệu lực từ ngày <span class="text-destructive">*</span>
      </label>
      <input
        hlmInput
        type="datetime-local"
        id="validFrom"
        formControlName="validFrom"
        class="w-full h-9 text-xs"
      />
    </div>

    <div>
      <label hlmLabel for="validTo" class="block font-medium text-foreground mb-1">
        Đến hết ngày <span class="text-destructive">*</span>
      </label>
      <input
        hlmInput
        type="datetime-local"
        id="validTo"
        formControlName="validTo"
        class="w-full h-9 text-xs"
      />
    </div>
  </div>

  <div class="flex justify-end gap-2 pt-3 border-t border-border">
    <button hlmBtn variant="outline" size="sm" type="button" (click)="cancel()">Hủy</button>
    <button
      hlmBtn
      variant="default"
      size="sm"
      type="submit"
      [disabled]="form.invalid || submitting()"
      class="bg-primary text-white text-primary-foreground cursor-pointer"
    >
      Tạo voucher
    </button>
  </div>
</form>
