<div class="flex items-start gap-3 sm:gap-4 p-4 sm:p-5 bg-surface dark:bg-surface-dark rounded-xl border border-border/80 dark:border-border-dark/80 shadow-xs hover:shadow-sm transition-all duration-300">
  <input
    type="checkbox"
    [checked]="item().selected"
    (change)="toggleSelect()"
    [attr.aria-label]="'Chọn sản phẩm ' + item().name"
    class="size-4.5 rounded border-border text-primary focus:ring-primary mt-1.5 cursor-pointer accent-primary"
  />

  <a [routerLink]="['/products', item().slug]" class="shrink-0 group">
    <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-lg bg-bg dark:bg-bg-dark flex items-center justify-center overflow-hidden border border-border/60">
      <img
        [src]="item().imageUrl"
        [alt]="item().name"
        loading="lazy"
        class="w-full h-full object-contain p-1 group-hover:scale-105 transition-transform duration-300"
      />
    </div>
  </a>

  <div class="flex-1 min-w-0">
    <a
      [routerLink]="['/products', item().slug]"
      class="font-medium text-sm sm:text-base line-clamp-2 hover:text-primary transition-colors duration-200 text-foreground"
    >
      {{ item().name }}
    </a>
    <p class="text-xs text-muted dark:text-muted-dark mt-1 font-medium">{{ item().brandName }}</p>
  </div>

  <div class="text-right shrink-0 min-w-0 flex flex-col items-end">
    <p class="text-primary font-bold text-sm sm:text-base">{{ item().price | currencyFormat }}</p>

    <!-- Stepper Quantity Input -->
    <div class="flex items-center border border-border dark:border-border-dark rounded-lg overflow-hidden bg-bg dark:bg-bg-dark mt-2.5">
      <button
        type="button"
        class="w-7 h-7 flex items-center justify-center hover:bg-muted/20 disabled:opacity-40 transition-colors"
        (click)="decrementQty()"
        [disabled]="item().quantity <= 1"
        aria-label="Giảm số lượng"
      >
        <lucide-icon [img]="MinusIcon" class="size-3" />
      </button>
      <span class="w-8 text-center text-xs font-semibold select-none" aria-live="polite">{{ item().quantity }}</span>
      <button
        type="button"
        class="w-7 h-7 flex items-center justify-center hover:bg-muted/20 disabled:opacity-40 transition-colors"
        (click)="incrementQty()"
        [disabled]="item().quantity >= item().stock"
        aria-label="Tăng số lượng"
      >
        <lucide-icon [img]="PlusIcon" class="size-3" />
      </button>
    </div>

    <!-- Delete Button -->
    <button
      type="button"
      (click)="remove()"
      class="inline-flex items-center gap-1 mt-2 text-xs text-muted hover:text-destructive transition-colors p-1"
      aria-label="Xóa sản phẩm"
    >
      <lucide-icon [img]="Trash2Icon" class="size-3.5" />
      <span>Xóa</span>
    </button>
  </div>
</div>
