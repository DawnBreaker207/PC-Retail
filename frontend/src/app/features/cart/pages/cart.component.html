<div class="max-w-screen-2xl mx-auto px-4 py-6 lg:py-8 min-h-[60vh]">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl lg:text-3xl font-bold tracking-tight">Giỏ hàng</h1>
    @if (items().length > 0) {
      <span class="text-sm text-muted dark:text-muted-dark">{{ items().length }} sản phẩm</span>
    }
  </div>

  @if (isLoading()) {
    <div class="flex justify-center py-20"><nz-spin nzSize="large"></nz-spin></div>
  } @else if (items().length === 0) {
    <div class="flex flex-col items-center justify-center py-20 animate-fade-in-up">
      <div class="w-24 h-24 rounded-full bg-bg dark:bg-bg-dark flex items-center justify-center mb-6">
        <span nz-icon nzType="shopping-cart" class="text-4xl text-muted dark:text-muted-dark"></span>
      </div>
      <p class="text-muted dark:text-muted-dark text-lg mb-2">Giỏ hàng trống</p>
      <p class="text-sm text-muted dark:text-muted-dark mb-6">Hãy thêm sản phẩm vào giỏ để tiếp tục mua sắm</p>
      <button nz-button nzType="primary" routerLink="/" class="!rounded-full !px-8 !shadow-sm hover:!shadow-md !transition-all">
        Mua sắm ngay
      </button>
    </div>
  } @else {
    <div class="flex items-center gap-4 mb-4 px-1">
      <label nz-checkbox nzId="cart-select-all" for="cart-select-all" [nzChecked]="allSelected" (nzCheckedChange)="toggleAll()" class="text-sm font-medium">Chọn tất cả</label>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 lg:gap-8">
      <div class="lg:col-span-2 space-y-4">
        @for (item of items(); track trackBySkuId($index, item)) {
          <app-cart-item [item]="item" />
        }
      </div>

      <div class="lg:col-span-1">
        <app-order-summary />
      </div>
    </div>
  }
</div>
