<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black/50 backdrop-blur-xs transition-opacity" (click)="onClose()"></div>

  <!-- Modal Dialog -->
  <div class="relative w-full max-w-2xl bg-surface dark:bg-surface-dark rounded-2xl border border-border/80 shadow-2xl p-6 overflow-hidden flex flex-col max-h-[85vh] animate-in fade-in zoom-in-95 duration-200">
    <!-- Header -->
    <div class="flex items-center justify-between pb-4 border-b border-border/80 mb-4">
      <div>
        <h2 class="text-base font-bold text-foreground">Chọn linh kiện</h2>
        <p class="text-xs text-muted dark:text-muted-dark">Danh sách linh kiện tương thích với slot này</p>
      </div>
      <button
        type="button"
        (click)="onClose()"
        class="text-muted hover:text-foreground p-1.5 rounded-lg hover:bg-muted/20 transition-colors"
        aria-label="Đóng"
      >
        <lucide-icon [img]="XIcon" class="size-4.5" />
      </button>
    </div>

    <!-- Search Input -->
    <div class="relative mb-4">
      <lucide-icon [img]="SearchIcon" class="size-4 text-muted absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" />
      <input
        hlmInput
        type="text"
        placeholder="Tìm kiếm sản phẩm theo tên hoặc mã..."
        aria-label="Tìm kiếm sản phẩm"
        class="w-full pl-9 pr-4 h-10 text-xs rounded-xl"
        [(ngModel)]="searchQuery"
      />
    </div>

    <!-- Content -->
    @if (loading()) {
      <div class="flex justify-center items-center py-20">
        <app-loading-spinner />
      </div>
    } @else if (filtered.length === 0) {
      <div class="flex flex-col items-center justify-center py-16 text-center">
        <lucide-icon [img]="PackageOpenIcon" class="size-12 text-muted/30 mb-2" />
        <p class="text-xs font-semibold text-muted">Không tìm thấy sản phẩm phù hợp</p>
      </div>
    } @else {
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 overflow-y-auto pr-1">
        @for (sku of filtered; track sku.id) {
          <div
            class="group border border-border/70 dark:border-border-dark/70 rounded-xl p-3 cursor-pointer transition-all hover:border-primary/50 hover:shadow-md bg-surface-card dark:bg-surface-card-dark flex flex-col justify-between"
            (click)="selectProduct(sku)"
          >
            <div>
              <div class="aspect-square bg-bg dark:bg-bg-dark rounded-lg overflow-hidden mb-2.5 flex items-center justify-center border border-border/50">
                <img [src]="sku.imageUrls?.[0] || ''" loading="lazy" appFallbackImage [alt]="sku.name" class="w-full h-full object-contain p-2 group-hover:scale-105 transition-transform" />
              </div>
              <p class="text-xs font-semibold text-foreground line-clamp-2 leading-snug mb-1.5">{{ sku.name }}</p>
            </div>
            <div>
              <p class="text-sm font-bold text-primary mb-1.5">{{ sku.price | currencyFormat }}</p>
              @if (sku.brandName) {
                <span hlmBadge variant="secondary" class="text-[10px] px-2 py-0.5 rounded mb-2">
                  {{ sku.brandName }}
                </span>
              }
              <button
                type="button"
                hlmBtn
                size="sm"
                variant="default"
                class="w-full h-8 text-xs font-bold rounded-lg"
                (click)="selectProduct(sku)"
              >
                Chọn linh kiện
              </button>
            </div>
          </div>
        }
      </div>
    }
  </div>
</div>
