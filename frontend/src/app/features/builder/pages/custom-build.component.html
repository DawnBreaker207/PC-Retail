<div class="max-w-[1400px] mx-auto px-4 pt-6 sm:pt-8 pb-12">
  <!-- Header Bar -->
  <div class="mb-6 pb-4 border-b border-border/70 dark:border-border-dark/70 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
    <div>
      <div class="flex items-center gap-2">
        <h1 class="text-xl sm:text-2xl font-black tracking-tight text-foreground">Tự Xây Dựng Cấu Hình PC</h1>
        <span hlmBadge>Smart Compatibility</span>
      </div>
      <p class="text-xs text-muted dark:text-muted-dark mt-1">
        Hệ thống tự động kiểm tra tương thích giữa CPU, Mainboard, RAM, GPU và tính toán công suất nguồn tối ưu theo chuẩn 3 cấp độ SAFE / WARNING / BLOCK.
      </p>
    </div>

    <div class="flex items-center gap-2 shrink-0">
      <button
        hlmBtn
        variant="default"
        class="text-white bg-gradient-to-r from-primary to-orange-500 hover:opacity-95 shadow-md flex items-center gap-2 font-bold px-4 h-10 cursor-pointer"
        (click)="aiModalOpen.set(true)"
        hlmTooltip="Yêu cầu AI tư vấn dàn máy chuẩn hiệu năng và ngân sách"
      >
        <lucide-icon [img]="SparklesIcon" class="size-4"></lucide-icon>
        AI Tư vấn cấu hình
      </button>
    </div>
  </div>

  @if (loading()) {
    <div class="space-y-3">
      @for (_ of [1,2,3,4,5,6]; track $index) {
        <div class="rounded-xl border border-border/60 dark:border-border-dark/60 p-4 flex items-center gap-4">
          <hlm-skeleton class="size-10 rounded-lg shrink-0" />
          <div class="flex-1 space-y-2">
            <hlm-skeleton class="h-4 w-1/3" />
            <hlm-skeleton class="h-3 w-1/2" />
          </div>
          <hlm-skeleton class="h-8 w-24 rounded-lg" />
        </div>
      }
    </div>
  } @else {
    <div class="flex flex-col lg:flex-row gap-6">
      <!-- Cột chính: Danh sách linh kiện (Chiếm phần lớn màn hình) -->
      <div class="flex-1 min-w-0">
        <app-slot-list
          [slots]="slots()"
          [selections]="selections()"
          [conflicts]="validation()?.conflicts ?? []"
          (selectSlot)="onSlotSelected($event)"
          (removeSlot)="onSlotRemoved($event)"
        />
      </div>

      <!-- Cột phụ: Bảng tóm tắt cấu hình & Công suất nguồn (Sticky bên phải) -->
      <div class="w-full lg:w-[380px] xl:w-[400px] shrink-0">
        <app-build-summary
          [selections]="selections()"
          [slots]="slots()"
          [validation]="validation()"
          [canAddToCart]="canAddToCart()"
          [missingRequired]="missingRequired()"
          (addToCart)="onAddToCart()"
          (clearBuild)="onClearBuild()"
        />
      </div>
    </div>
  }

  @if (aiModalOpen()) {
    <app-ai-builder-modal
      (closed)="aiModalOpen.set(false)"
      (buildApplied)="onAiBuildApplied($event)"
    />
  }
</div>
