@if (isSuccess()) {
  <nz-result
    nzStatus="success"
    nzTitle="Đặt hàng thành công!"
    [nzSubTitle]="'Mã đơn hàng: #ORD-' + orderId()"
  >
    <div nz-result-extra>
      <button nz-button nzType="primary" [routerLink]="['/orders', orderId()]" class="!rounded-lg">Xem đơn hàng</button>
      <button type="button" nz-button routerLink="/" class="!rounded-lg">Tiếp tục mua sắm</button>
    </div>
  </nz-result>
} @else if (isPlaced()) {
  <nz-result
    nzStatus="info"
    nzTitle="Đã nhận đơn hàng!"
    [nzSubTitle]="'Mã đơn hàng: #ORD-' + orderId() + ' — đang chờ thanh toán. Bạn có thể tra cứu trạng thái bất cứ lúc nào.'"
  >
    <div nz-result-extra>
      <button nz-button nzType="primary" routerLink="/tra-cuu-don-hang" class="!rounded-lg">Tra cứu đơn hàng</button>
      <button type="button" nz-button routerLink="/" class="!rounded-lg">Tiếp tục mua sắm</button>
    </div>
  </nz-result>
} @else {
  <nz-result
    nzStatus="error"
    nzTitle="Thanh toán thất bại"
    nzSubTitle="Vui lòng thử lại hoặc liên hệ hỗ trợ."
  >
    <div nz-result-extra>
      <button nz-button nzType="primary" routerLink="/checkout" class="!rounded-lg">Thử lại</button>
      <button type="button" nz-button routerLink="/orders" class="!rounded-lg">Hủy đơn</button>
    </div>
  </nz-result>
}
