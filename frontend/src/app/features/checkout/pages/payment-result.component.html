@if (isSuccess()) {
  <nz-result
    nzStatus="success"
    nzTitle="Đặt hàng thành công!"
    [nzSubTitle]="'Mã đơn hàng: #ORD-' + orderId()"
  >
    <div nz-result-extra>
      <button nz-button nzType="primary" [routerLink]="['/orders', orderId()]">Xem đơn hàng</button>
      <button nz-button routerLink="/">Tiếp tục mua sắm</button>
    </div>
  </nz-result>
} @else {
  <nz-result
    nzStatus="error"
    nzTitle="Thanh toán thất bại"
    nzSubTitle="Vui lòng thử lại hoặc liên hệ hỗ trợ."
  >
    <div nz-result-extra>
      <button nz-button nzType="primary" routerLink="/checkout">Thử lại</button>
      <button nz-button routerLink="/orders">Hủy đơn</button>
    </div>
  </nz-result>
}
