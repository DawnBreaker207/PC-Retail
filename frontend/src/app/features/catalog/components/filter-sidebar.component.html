<div class="flex flex-wrap items-center gap-2">
  <!-- Danh mục -->
  <nz-select
    [ngModel]="filters().category"
    (ngModelChange)="selectCategory($event)"
    nzPlaceHolder="Danh mục"
    nzAllowClear
    class="min-w-[140px]"
  >
    @for (cat of categories(); track cat.slug) {
      <nz-option [nzValue]="cat.slug" [nzLabel]="cat.name" />
    }
  </nz-select>

  <!-- Khoảng giá -->
  <nz-select
    nzPlaceHolder="Khoảng giá"
    nzAllowClear
    class="min-w-[140px]"
    [ngModel]="selectedPriceLabel()"
    (ngModelChange)="onPriceSelect($event)"
  >
    @for (range of priceRanges; track range.label) {
      <nz-option [nzValue]="range.label" [nzLabel]="range.label" />
    }
  </nz-select>

  <!-- Thương hiệu -->
  <nz-select
    nzMode="multiple"
    nzPlaceHolder="Thương hiệu"
    class="min-w-[140px]"
    [ngModel]="filters().brands"
    (ngModelChange)="selectBrand($event)"
  >
    @for (brand of brands(); track brand) {
      <nz-option [nzValue]="brand" [nzLabel]="brand" />
    }
  </nz-select>

  <!-- Active filters -->
  @if (hasActive()) {
    <div class="flex flex-wrap items-center gap-1">
      @for (af of activeFilters; track af.type + af.value) {
        <nz-tag nzMode="closeable" (nzOnClose)="removeFilter(af)" class="!text-xs !rounded-md">
          {{ af.label }}
        </nz-tag>
      }
      <button nz-button nzType="link" nzSize="small" class="!text-xs !p-0 !h-auto" (click)="clearAll()">
        <span nz-icon nzType="delete" nzTheme="outline"></span>
        Xóa
      </button>
    </div>
  }
</div>
