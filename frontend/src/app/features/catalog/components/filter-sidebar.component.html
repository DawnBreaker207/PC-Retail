<div class="flex flex-wrap items-center gap-2.5">
  <!-- Danh mục -->
  <div class="relative">
    <select
      hlmSelect
      size="sm"
      [value]="filters().category"
      (change)="selectCategory($event)"
      aria-label="Lọc theo danh mục"
      class="min-w-[140px]"
    >
      <option value="">Tất cả danh mục</option>
      @for (cat of categories(); track cat.slug) {
        <option [value]="cat.slug">{{ cat.name }}</option>
      }
    </select>
    <div class="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 text-muted dark:text-muted-dark text-[10px]">▼</div>
  </div>

  <!-- Khoảng giá -->
  <div class="relative">
    <select
      hlmSelect
      size="sm"
      [value]="selectedPriceLabel()"
      (change)="onPriceSelect($event)"
      aria-label="Lọc theo khoảng giá"
      class="min-w-[140px]"
    >
      <option value="">Khoảng giá</option>
      @for (range of priceRanges; track range.label) {
        <option [value]="range.label">{{ range.label }}</option>
      }
    </select>
    <div class="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 text-muted dark:text-muted-dark text-[10px]">▼</div>
  </div>

  <!-- Thương hiệu -->
  <div class="relative">
    <select
      hlmSelect
      size="sm"
      (change)="selectBrand($event)"
      aria-label="Lọc theo thương hiệu"
      class="min-w-[140px]"
    >
      <option value="">+ Thêm thương hiệu</option>
      @for (brand of brands(); track brand) {
        <option [value]="brand">{{ brand }}</option>
      }
    </select>
    <div class="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 text-muted dark:text-muted-dark text-[10px]">▼</div>
  </div>

  <!-- Thông số kỹ thuật theo danh mục -->
  @for (spec of specOptions(); track spec.label) {
    <div class="relative">
      <select
        hlmSelect
        size="sm"
        (change)="selectSpec(spec.label, $event)"
        [attr.aria-label]="'Lọc theo ' + spec.label"
        class="min-w-[140px]"
      >
        <option value="">+ {{ spec.label }}</option>
        @for (value of spec.values; track value) {
          <option [value]="value">{{ value }}</option>
        }
      </select>
      <div class="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 text-muted dark:text-muted-dark text-[10px]">▼</div>
    </div>
  }

  <!-- Active filters -->
  @if (hasActive()) {
    <div class="flex flex-wrap items-center gap-1.5 ml-1">
      @for (af of activeFilters; track af.type + af.value) {
        <span
          hlmBadge
          variant="secondary"
          class="inline-flex items-center gap-1 rounded-md px-2 py-1 text-xs font-medium bg-secondary text-secondary-foreground border border-border/60"
        >
          <span>{{ af.label }}</span>
          <button
            hlmBtn
            variant="ghost"
            size="icon"
            type="button"
            (click)="removeFilter(af)"
            class="h-4 w-4 text-muted-foreground hover:text-foreground transition-colors ml-0.5 rounded-full p-0"
            [attr.aria-label]="'Bỏ lọc ' + af.label"
          >
            <lucide-icon [img]="XIcon" class="size-3" />
          </button>
        </span>
      }
      <button
        type="button"
        hlmBtn
        variant="ghost"
        size="sm"
        class="h-7 px-2 text-xs text-destructive hover:text-destructive/80 hover:bg-destructive/10 rounded-md transition-colors inline-flex items-center gap-1"
        (click)="clearAll()"
      >
        <lucide-icon [img]="Trash2Icon" class="size-3.5" />
        Xóa tất cả
      </button>
    </div>
  }
</div>
