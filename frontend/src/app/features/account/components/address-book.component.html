<div class="py-4">
  <div class="flex items-center justify-between mb-4">
    <p class="text-sm text-muted dark:text-muted-dark">Quản lý địa chỉ giao hàng của bạn</p>
    <button nz-button nzType="primary" nzSize="small" (click)="openCreateModal()">
      <span nz-icon nzType="plus"></span>
      Thêm địa chỉ
    </button>
  </div>

  @if (loading()) {
    <div class="flex justify-center py-10"><nz-spin nzSize="large"></nz-spin></div>
  } @else if (addresses().length === 0) {
    <app-empty-state
      title="Bạn chưa có địa chỉ nào"
      description="Thêm địa chỉ để đặt hàng nhanh hơn ở lần mua tiếp theo."
    />
  } @else {
    <div class="flex flex-col gap-3">
      @for (a of addresses(); track a.id) {
        <div class="rounded-xl border border-border/80 dark:border-border-dark/80 p-4 flex items-start justify-between gap-3">
          <div class="min-w-0">
            <div class="flex items-center gap-2 mb-1">
              <span class="font-semibold text-sm">{{ a.label || 'Địa chỉ' }}</span>
              @if (a.isDefault) {
                <nz-tag nzColor="success" class="!text-[11px]">Mặc định</nz-tag>
              }
            </div>
            <p class="text-sm">{{ a.fullName }} — {{ a.phone }}</p>
            <p class="text-sm text-muted dark:text-muted-dark">{{ a.street }}, {{ a.district }}, {{ a.city }}</p>
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <button nz-button nzType="text" nzSize="small" (click)="openEditModal(a)" aria-label="Sửa">
              <span nz-icon nzType="edit"></span>
            </button>
            <button
              nz-button nzType="text" nzSize="small" nzDanger
              nz-popconfirm nzPopconfirmTitle="Xóa địa chỉ này?"
              (nzOnConfirm)="deleteAddress(a.id)"
              aria-label="Xóa"
            >
              <span nz-icon nzType="delete"></span>
            </button>
          </div>
        </div>
      }
    </div>
  }
</div>
