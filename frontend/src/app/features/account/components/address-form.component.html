<div hlmDialogOverlay (click)="cancel()"></div>
<div hlmDialogContent class="max-w-lg w-full">
  <div hlmDialogHeader class="flex flex-row items-center justify-between pb-3 border-b border-border/60 dark:border-border-dark/60">
    <h3 hlmDialogTitle class="text-base font-bold text-ink dark:text-ink-dark">
      {{ address() ? 'Cập nhật địa chỉ' : 'Thêm địa chỉ nhận hàng mới' }}
    </h3>
    <button
      hlmBtn
      variant="ghost"
      size="icon"
      type="button"
      (click)="cancel()"
      class="text-muted hover:text-ink dark:hover:text-ink-dark"
    >
      <lucide-angular [img]="X" class="w-5 h-5" />
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
    <div>
      <label hlmLabel for="label" class="block text-xs font-semibold text-ink dark:text-ink-dark mb-1.5">Tên gợi nhớ (VD: Nhà riêng, Công ty...)</label>
      <input hlmInput id="label" formControlName="label" placeholder="VD: Nhà riêng" class="w-full" />
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div>
        <label hlmLabel for="fullName" class="block text-xs font-semibold text-ink dark:text-ink-dark mb-1.5">Người nhận</label>
        <input hlmInput id="fullName" formControlName="fullName" placeholder="Họ và tên" class="w-full" />
      </div>
      <div>
        <label hlmLabel for="phone" class="block text-xs font-semibold text-ink dark:text-ink-dark mb-1.5">Số điện thoại</label>
        <input hlmInput id="phone" formControlName="phone" placeholder="Số điện thoại" class="w-full" />
      </div>
    </div>

    <div>
      <label hlmLabel for="street" class="block text-xs font-semibold text-ink dark:text-ink-dark mb-1.5">Địa chỉ cụ thể</label>
      <input hlmInput id="street" formControlName="street" placeholder="Số nhà, tên đường, ngõ ngách" class="w-full" />
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div>
        <label hlmLabel for="district" class="block text-xs font-semibold text-ink dark:text-ink-dark mb-1.5">Quận / Huyện</label>
        <input hlmInput id="district" formControlName="district" placeholder="Quận/Huyện" class="w-full" />
      </div>
      <div>
        <label hlmLabel for="city" class="block text-xs font-semibold text-ink dark:text-ink-dark mb-1.5">Tỉnh / Thành phố</label>
        <input hlmInput id="city" formControlName="city" placeholder="Tỉnh/Thành phố" class="w-full" />
      </div>
    </div>

    <div hlmDialogFooter class="pt-3 border-t border-border/60 dark:border-border-dark/60 mt-6">
      <button hlmBtn variant="outline" type="button" (click)="cancel()">Hủy</button>
      <button hlmBtn type="submit" class="text-white" [disabled]="form.invalid || submitting()">
        @if (submitting()) {
          <lucide-angular [img]="Loader2" class="w-4 h-4 mr-2 animate-spin text-white" />
        }
        {{ address() ? 'Lưu thay đổi' : 'Thêm địa chỉ' }}
      </button>
    </div>
  </form>
</div>
