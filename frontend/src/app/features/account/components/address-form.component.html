<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs animate-fade-in">
  <div class="bg-surface dark:bg-surface-dark border border-border/80 dark:border-border-dark/80 rounded-2xl shadow-2xl max-w-lg w-full p-6 animate-scale-in relative">
    <div class="flex items-center justify-between pb-3 border-b border-border/60 dark:border-border-dark/60 mb-5">
      <h3 class="text-base font-bold text-ink dark:text-ink-dark">
        {{ address() ? 'Cập nhật địa chỉ' : 'Thêm địa chỉ nhận hàng mới' }}
      </h3>
      <button
        type="button"
        (click)="cancel()"
        class="text-muted hover:text-ink dark:hover:text-ink-dark p-1 rounded-lg hover:bg-bg dark:hover:bg-bg-dark transition-colors"
      >
        <lucide-angular [img]="X" class="w-5 h-5" />
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label for="label" class="block text-xs font-semibold text-ink dark:text-ink-dark mb-1.5">Tên gợi nhớ (VD: Nhà riêng, Công ty...)</label>
        <input hlmInput id="label" formControlName="label" placeholder="VD: Nhà riêng" class="w-full" />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label for="fullName" class="block text-xs font-semibold text-ink dark:text-ink-dark mb-1.5">Người nhận</label>
          <input hlmInput id="fullName" formControlName="fullName" placeholder="Họ và tên" class="w-full" />
        </div>
        <div>
          <label for="phone" class="block text-xs font-semibold text-ink dark:text-ink-dark mb-1.5">Số điện thoại</label>
          <input hlmInput id="phone" formControlName="phone" placeholder="Số điện thoại" class="w-full" />
        </div>
      </div>

      <div>
        <label for="street" class="block text-xs font-semibold text-ink dark:text-ink-dark mb-1.5">Địa chỉ cụ thể</label>
        <input hlmInput id="street" formControlName="street" placeholder="Số nhà, tên đường, ngõ ngách" class="w-full" />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label for="district" class="block text-xs font-semibold text-ink dark:text-ink-dark mb-1.5">Quận / Huyện</label>
          <input hlmInput id="district" formControlName="district" placeholder="Quận/Huyện" class="w-full" />
        </div>
        <div>
          <label for="city" class="block text-xs font-semibold text-ink dark:text-ink-dark mb-1.5">Tỉnh / Thành phố</label>
          <input hlmInput id="city" formControlName="city" placeholder="Tỉnh/Thành phố" class="w-full" />
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-3 border-t border-border/60 dark:border-border-dark/60 mt-6">
        <button hlmBtn variant="outline" type="button" (click)="cancel()">Hủy</button>
        <button hlmBtn type="submit" [disabled]="form.invalid || submitting()">
          @if (submitting()) {
            <lucide-angular [img]="Loader2" class="w-4 h-4 mr-2 animate-spin" />
          }
          {{ address() ? 'Lưu thay đổi' : 'Thêm địa chỉ' }}
        </button>
      </div>
    </form>
  </div>
</div>
