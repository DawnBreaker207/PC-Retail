<div class="py-4">
  <div class="flex flex-wrap sm:flex-nowrap gap-2.5 mb-6 max-w-md">
    <input
      hlmInput
      placeholder="Nhập mã ưu đãi để kiểm tra"
      [ngModel]="code()"
      (ngModelChange)="code.set($event)"
      name="voucherCode"
      class="flex-1"
    />
    <button hlmBtn [disabled]="!code().trim() || checking()" (click)="checkCode()" class="shrink-0">
      @if (checking()) {
        <lucide-angular [img]="Loader2" class="w-4 h-4 mr-1.5 animate-spin" />
      } @else {
        <lucide-angular [img]="Ticket" class="w-4 h-4 mr-1.5" />
      }
      Kiểm tra mã
    </button>
  </div>

  @if (loading()) {
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
      @for (_ of [1,2,3,4]; track $index) {
        <div class="rounded-xl border border-dashed border-border/60 p-4 space-y-2.5">
          <div class="flex justify-between">
            <hlm-skeleton class="h-4 w-28" />
            <hlm-skeleton class="size-5 rounded" />
          </div>
          <hlm-skeleton class="h-4 w-3/4" />
          <hlm-skeleton class="h-3 w-full" />
          <hlm-skeleton class="h-3 w-2/3" />
        </div>
      }
    </div>
  } @else if (vouchers().length === 0) {
    <app-empty-state title="Chưa có mã ưu đãi nào" description="Theo dõi các chương trình khuyến mãi để nhận thêm voucher mới nhé." />
  } @else {
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
      @for (v of vouchers(); track v.id) {
        <div class="rounded-xl border border-dashed border-primary/40 bg-primary/5 dark:bg-primary/10 p-4 flex flex-col justify-between gap-2 relative overflow-hidden">
          <div class="flex items-center justify-between">
            <span class="font-mono font-bold text-primary text-sm tracking-wider">{{ v.code }}</span>
            <lucide-angular [img]="Gift" class="text-primary w-5 h-5 shrink-0" />
          </div>
          <div>
            <p class="text-sm font-bold text-ink dark:text-ink-dark">Giảm {{ formatDiscount(v) }}</p>
            <p class="text-xs text-muted dark:text-muted-dark mt-0.5 line-clamp-1">{{ v.description }}</p>
          </div>
          <div class="pt-2 border-t border-primary/20 text-[11px] text-muted dark:text-muted-dark">
            Đơn tối thiểu {{ v.minOrder | currencyFormat }} · HSD: {{ v.expiry }}
          </div>
        </div>
      }
    </div>
  }
</div>
