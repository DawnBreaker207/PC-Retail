@if (breadcrumbs().length > 0) {
  <nav hlmBreadcrumb class="mb-2">
    @for (crumb of breadcrumbs(); track crumb.label; let last = $last) {
      @if (crumb.url && !last) {
        <a [routerLink]="crumb.url" hlmBreadcrumbLink>{{ crumb.label }}</a>
        <lucide-angular [img]="ChevronRight" class="w-3.5 h-3.5 text-muted/60" />
      } @else {
        <span hlmBreadcrumbCurrent class="text-ink dark:text-ink-dark">{{ crumb.label }}</span>
      }
    }
  </nav>
}
<h1 class="text-2xl font-bold mb-1 text-ink dark:text-ink-dark">{{ title() }}</h1>
@if (subtitle()) {
  <p class="text-muted dark:text-muted-dark text-sm mb-6">{{ subtitle() }}</p>
}
